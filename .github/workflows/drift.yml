# Scheduled drift detection — read-only `otterdog plan --local --no-web-ui` of
# the committed config against live `vig-os`, fed to the in-house strict-drift
# layer, which reconciles the plan into deduplicated `drift`+`critical` issues
# (issue #20, ADR-0002 issue-only drift semantics, ADR-0007 L1 core). The same
# run also sweeps the live org repo inventory against the declared set and flags
# undeclared / absent repos into the SAME lifecycle (issue #21), and asserts the
# controls otterdog CANNOT model — Actions SHA-pinning, the fork-PR approval
# policy, the new-repository security defaults, org-secret metadata — directly
# against the live REST API from `unmanaged-controls.toml` (issue #116). All
# three populations share one dedup'd issue lifecycle, partitioned by label.
#
# This is a repo-OWNED workflow (not devkit-managed), so zizmor gates it in full:
# it is deliberately absent from zizmor.yml, and the only accepted findings are
# the two scoped, justified `github-app` inline ignores on the full plan token.
# Everything else must be fixed here, not baselined.
#
# SERIALIZED WITH APPLY (ADR-0007 BINDING): this run JOINS the same static
# `otterdog-mutate` concurrency group as apply.yml with `cancel-in-progress:
# false`, so drift never runs concurrently with an apply (or another drift) —
# a reconciler racing a mutation manufactures phantom drift. Drift issue-ops are
# a mutation of repo state (issues), hence the shared group, not a plan-style
# per-run group.
#
# Security model (ADR-0007 §Public-repo credential rules, BINDING):
#   - Scheduled / manual only; `schedule` and `workflow_dispatch` never carry
#     fork-supplied code, so org-admin credentials are never exposed to a fork
#     (OWASP CICD-SEC-4, Poisoned Pipeline Execution). The `if:` asserts repo
#     identity as belt-and-braces.
#   - No `pull_request_target`; the default checkout is read-only.
#   - Two least-privilege App tokens, each scoped to what it may do:
#       * FULL, unnarrowed, org-wide installation token — the otterdog `plan`
#         read surface needs it (a narrowed token cannot carry Actions Variables;
#         org-variables read is fatal on 403 — ADR-0004 Corrections, spike #16).
#         Read-only-ness is enforced by BEHAVIOR: `plan` only issues GETs. The
#         inventory sweep's org-repo read (`GET /orgs/vig-os/repos`, #21) reuses
#         this same full token (a narrowed token cannot list org repos) and is
#         likewise read-only by behavior. So is the unmanaged-control assertion
#         leg (#116): every one of its endpoints — `GET /orgs/{org}`,
#         `/orgs/{org}/actions/permissions[/fork-pr-contributor-approval]`,
#         `/orgs/{org}/actions/secrets[/{name}/repositories]`,
#         `/repos/{org}/{repo}[/actions/permissions...]` — is a GET, and the
#         permissions they need (Org Administration read, Org Secrets read, Repo
#         Administration read) are already inside this grant, so the leg adds NO
#         token, permission or App-grant change (docs/runbooks/github-app.md).
#       * issue-ops token — a SECOND token narrowed to `issues: write` on this
#         repo only. ALL issue writes (plan-drift AND inventory) run on this
#         smallest grant, never the org-admin token.
#
# `--local` gates ONLY the vendor re-fetch (identical to plan.yml / apply.yml):
# it skips otterdog's `_init_base_template`, so plan evaluates the exact committed
# `otterdog/vig-os/vendor/` tree that L0 `validate` and L2 `plan` check. Live diff
# and credentials are unaffected.
#
# DEFAULT-BRANCH REGISTRATION / ACTIVATION MODEL (devkit release model): GitHub
# registers `schedule` and `workflow_dispatch` triggers ONLY from a repo's
# DEFAULT branch — here trunk `main` (#63 trunk model: `main` is the single
# branch, where this file is both developed AND applied). So this workflow is
# REGISTERED once this file lands on `main`: from then the daily cron below and
# `workflow_dispatch` can fire. (Pre-trunk, under gitflow, registration waited on
# the first release promoting the file from `dev` onto `main`; the trunk switch
# collapses that dev/main split, so there is no release gap left to bridge.)
#
# CHECKOUT REF IS THE DEFAULT (`main`): under the trunk model `main` is both
# where GitHub registers this workflow's triggers AND where the DATA and code it
# must operate on live — the committed `otterdog/` config, the `src/drift_layer/`
# Python, `drift-allowlist.toml`, and the `justfile.project` otterdog pin. So the
# default `actions/checkout` ref (the triggering ref, `main`) is exactly the tree
# to scan; NO explicit `ref:` pin is needed. (The old gitflow `ref: dev` pin
# bridged a released-`main` workflow to dev-resident config between releases;
# that split is gone under trunk, so the pin is removed.) The `workflow_call` /
# downstream-caller story is unchanged: a caller's reusable run still reads the
# committed config, drift-layer code, and allow-list from the CALLER's checkout.

# REUSABLE INTERFACE (issue #24, ADR-0006): this workflow ALSO exposes
# `workflow_call` so a downstream org's private `org-config` repo (from the
# `template/` skeleton) can run its own scheduled drift, pinned to an exact
# tag/SHA. A downstream caller owns the `schedule:` trigger in its thin caller
# workflow and passes its org via `inputs`; the reusable body here reads the
# committed config, drift-layer code, and allow-list from the CALLER's checkout.
# Inputs default to `vig-os`/`org-config` and the App credentials fall through to
# this repo's own bootstrap secrets on a non-`workflow_call` event, so this repo's
# own daily `schedule` keeps byte-identical semantics.
name: Drift

on:  # yamllint disable-line rule:truthy
  schedule:
    # 03:17 UTC daily — off-peak, odd minute to dodge cron congestion.
    - cron: "17 3 * * *"
  workflow_dispatch:
  workflow_call:
    inputs:
      org_github_id:
        description: >-
          GitHub login of the org to scan — the `otterdog plan` positional arg,
          the App-token `owner`, the `--org` the reconciler reports on, and the
          `otterdog/<org>/<org>.jsonnet` inventory source. Defaults to `vig-os`.
        type: string
        default: vig-os
      config_repo:
        description: >-
          Name of the org's config repo — the `repositories:` scope of the
          narrowed issue-ops token. Defaults to `org-config`.
        type: string
        default: org-config
      otterdog_version:
        description: >-
          Otterdog version to run. Downstream callers MUST pass their own pin
          (kept in the caller workflow beside the engine SHA pin, issue #56);
          when empty — this repo's own events — the pin is read from
          `justfile.project` (ADR-0005 SSoT).
        type: string
        default: ''
    # Secret names MATCH this repo's bootstrap Actions secrets (github-app.md), so
    # the credential references below are byte-identical whether reached on this
    # repo's own schedule (repo secrets) or via `workflow_call` (caller-passed). A
    # downstream caller passes its own identically-named secrets.
    secrets:
      ORG_CONFIG_APP_CLIENT_ID:
        description: Client ID of the org-management GitHub App (ADR-0004).
        required: true
      ORG_CONFIG_APP_PRIVATE_KEY:
        description: PEM private key of the org-management GitHub App (ADR-0004).
        required: true

# Join the cross-workflow mutation group so drift and apply serialize and never
# cancel each other mid-run (ADR-0007). Caller-scoped: the org suffix is EMPTY on
# this repo's own events, so the group stays literally `otterdog-mutate` here —
# byte-identical, still shared with apply.yml + testbed-e2e.yml. A downstream
# caller passes its org, yielding `otterdog-mutate-<org>`.
concurrency:
  group: otterdog-mutate${{ inputs.org_github_id && format('-{0}', inputs.org_github_id) || '' }}
  cancel-in-progress: false

permissions: {}

jobs:
  drift:
    name: Detect drift and reconcile drift+critical issues
    # ADR-0007 BINDING: drift runs only on the config repo itself (scheduled/
    # manual/called events do not originate from forks); here to be explicit.
    # Generalized from the `vig-os/org-config` literal to the caller's own
    # `<org>/<config_repo>` (defaults resolve to `vig-os/org-config` on this
    # repo's own events — same truth value), so a downstream caller asserts its
    # OWN repo identity.
    if: github.repository == format('{0}/{1}', inputs.org_github_id || 'vig-os', inputs.config_repo || 'org-config')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions: {}
    steps:
      - name: Checkout repository
        # Default checkout ref (the triggering ref, trunk `main`): under the
        # trunk model `main` is both where GitHub registers this schedule/
        # dispatch and where the config, drift-layer code, allow-list, and
        # otterdog pin live, so the default ref is exactly the tree to scan — see
        # the header. No `ref:` pin needed.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0

      # Otterdog version pin: on this repo's own events, justfile.project
      # (`otterdog_version`) is the single source of truth (ADR-0005). Downstream
      # callers check out THEIR repo (no justfile.project — template/ ships none,
      # issue #56), so they pass the pin as the `otterdog_version` input instead.
      - name: Resolve otterdog version pin
        env:
          OTTERDOG_VERSION_INPUT: ${{ inputs.otterdog_version || '' }}
        run: |
          set -euo pipefail
          if [ -n "${OTTERDOG_VERSION_INPUT}" ]; then
            version="${OTTERDOG_VERSION_INPUT}"
          elif [ -f justfile.project ]; then
            version="$(grep -oP 'otterdog_version\s*:=\s*"\K[^"]+' justfile.project)"
          else
            echo "::error::no otterdog_version input and no justfile.project in the checkout (downstream callers must pass the input — issue #56)"
            exit 1
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not resolve otterdog_version from justfile.project"
            exit 1
          fi
          echo "OTTERDOG_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved otterdog version: ${version}"

      # FULL installation token — NO permission-* narrowing (ADR-0004
      # Corrections): the App grant is the boundary; a narrowed token cannot read
      # Actions Variables. `owner: vig-os` makes it org-wide because plan must see
      # every repo. This is the plan (read) leg only; the issue writes use the
      # separate narrowed token below. zizmor's github-app finding on the broad
      # token is an acknowledged, deliberate decision recorded INLINE.
      - name: Mint full App installation token for plan (unnarrowed, org-wide)
        id: plan-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org_github_id || 'vig-os' }}  # zizmor: ignore[github-app]

      - name: Run otterdog plan (read-only, committed config)
        id: plan
        env:
          # The `env` credential provider reads the token from this variable.
          OTTERDOG_TOKEN: ${{ steps.plan-token.outputs.token }}
          # Org selector, via env (never inline `${{ }}` in `run:`) to keep the
          # zizmor template-injection surface closed. Empty inputs -> vig-os.
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
          # Dummy web credentials. `plan --no-web-ui` resolves credentials with
          # only_token=True, so these are never exercised; supplied only to
          # satisfy the env provider's declared keys.
          OTTERDOG_DUMMY_USERNAME: drift-dummy-unused
          OTTERDOG_DUMMY_PASSWORD: drift-dummy-unused
          OTTERDOG_DUMMY_TWOFA_SEED: drift-dummy-unused
          # Deterministic, unwrapped output the parser can rely on.
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          # No errexit: otterdog's exit code is a signal we inspect, not an abort
          # reason. `plan` exits 0 on a non-empty diff; nonzero means invalid
          # config / auth / harness failure.
          set -uo pipefail
          OTTER=(uvx --with python-dotenv==1.1.0 --from "otterdog@${OTTERDOG_VERSION}" otterdog)
          set +e
          "${OTTER[@]}" plan --local --no-web-ui -c otterdog.json "${ORG_GITHUB_ID}" >plan.txt 2>&1
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "otterdog plan exited ${rc}"
          cat plan.txt

      # Fail fast on a genuine plan error (invalid config / auth / harness):
      # reconciling a broken plan would misread it as "no drift" and wrongly
      # close live issues. Drift (exit 0) proceeds to reconciliation.
      - name: Fail on plan error
        env:
          PLAN_RC: ${{ steps.plan.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "${PLAN_RC:-1}" != "0" ]; then
            echo "::error::otterdog plan failed (exit ${PLAN_RC}); not drift — check config, auth, or harness. Skipping reconciliation to avoid closing live issues on a broken plan."
            exit 1
          fi
          echo "otterdog plan succeeded (exit 0); reconciling drift issues."

      # SECOND token, narrowed to issues:write on this repo only — the smallest
      # grant the issue-ops leg needs. Narrowing works fine for issues (unlike
      # the Actions-Variables read the plan leg needs), so the divergence-issue
      # writes never ride the org-admin token.
      - name: Mint narrowed App token for issue ops (issues:write, this repo)
        id: issues-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          # This token narrows fine (issues:write is expressible), scoped to the
          # caller's own config repo only.
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org_github_id || 'vig-os' }}
          repositories: ${{ inputs.config_repo || 'org-config' }}
          permission-issues: write

      # THREE populations reconciled in one invocation, each with its own label
      # and its own degradation contract:
      #   1. plan drift          — `drift`+`critical`
      #   2. inventory sweep     — + `inventory` (issue #21): live org repos vs
      #      the declared set in the committed config.
      #   3. unmanaged controls  — + `unmanaged-control` (issue #116): live
      #      settings otterdog has NO schema field for, so they appear in no plan
      #      diff at all, asserted straight from the REST API against
      #      `unmanaged-controls.toml`.
      # Two tokens, each for exactly what it may do:
      #   - GITHUB_TOKEN      = the issues:write-narrowed token (all issue writes)
      #   - DRIFT_REPOS_TOKEN = the full plan token, ONLY for the org/repo READ
      #     legs (a narrowed token cannot list org repos or read org settings).
      # EXPLICIT DEGRADATION (issues #21/#116 BINDING): a live-read failure must
      # NOT skip reconciliation of the other populations. The CLI catches the
      # failure IN-TOOL, reconciles what it can, leaves the failed leg's issues
      # untouched (never phantom-closes them), and exits 0 — so this step stays
      # green on a degraded leg WITHOUT a blanket `continue-on-error` that would
      # also mask a genuine reconcile failure (an issue-write error still,
      # correctly, reddens the run). The controls leg degrades PER ROW: a row
      # whose endpoint 403s or whose field moved has its own issue withheld from
      # reconciliation, so one unreadable control can neither be reported as
      # drift nor silently resolve a real finding, while every other row still
      # reports. Those rows surface as `::warning::` annotations, not failures.
      - name: Reconcile plan drift, inventory sweep and live control assertions
        env:
          GITHUB_TOKEN: ${{ steps.issues-token.outputs.token }}
          DRIFT_REPOS_TOKEN: ${{ steps.plan-token.outputs.token }}
          # Org selector, via env (never inline `${{ }}` in `run:`). Empty inputs
          # -> vig-os, so `--org`/`--config-jsonnet` are byte-identical here.
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
        run: |
          set -euo pipefail
          # Tee (stdout+stderr) so the run summary can fence the reconciler's own
          # output — the actions taken plus the per-row control annotations —
          # without teaching the CLI anything about GitHub Actions. `pipefail`
          # keeps the tool's exit code authoritative through the pipe.
          uv run drift-layer \
            --plan-file plan.txt \
            --repo "${{ github.repository }}" \
            --org "${ORG_GITHUB_ID}" \
            --allowlist drift-allowlist.toml \
            --config-jsonnet "otterdog/${ORG_GITHUB_ID}/${ORG_GITHUB_ID}.jsonnet" \
            --unmanaged-controls unmanaged-controls.toml 2>&1 | tee drift-layer.txt

      - name: Drift run summary
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo "## Drift reconciliation — \`vig-os\`"
            echo
            echo "_Read-only \`otterdog plan --local --no-web-ui\` + live repo inventory sweep + live unmanaged-control assertions, reconciled into deduplicated \`drift\`+\`critical\` issues (ADR-0002, #21, #116). Nothing was applied to org state._"
            echo
            echo '```text'
            [ -f plan.txt ] && cat plan.txt || echo "(no plan output produced)"
            echo '```'
            echo
            echo "### Reconciler output"
            echo
            echo "_Actions taken across all three populations, plus any per-row control annotations (tolerated divergences and rows that could not be read)._"
            echo
            echo '```text'
            [ -f drift-layer.txt ] && cat drift-layer.txt || echo "(no reconciler output produced)"
            echo '```'
            echo
            echo "[Run log](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"
