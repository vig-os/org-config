# Spike: App-token coverage of the Otterdog settings surface (issue #16, M2)
#
# ADR-0004 assumes a GitHub App installation token reaches the ENTIRE Otterdog
# settings surface. Otterdog has historically also scraped a handful of org
# settings through the GitHub *web UI* (Playwright + username/password/TOTP),
# because they are not exposed by the REST/GraphQL API. This spike verifies the
# assumption empirically and enumerates exactly which settings fall outside App
# reach, so ADR-0004's Corrections log can record the truth.
#
# STRICTLY READ-ONLY BEHAVIOR, TWO TOKENS. Because GitHub's token-narrowing
# schema cannot express Actions Variables (see the gap note at the first mint),
# this spike proves BOTH sides in one run:
#   - a NARROWED read-only token (every expressible read permission) drives the
#     original probes — its import is expected to fail exactly and only at
#     GET /orgs/vig-os/actions/variables, confirming the endpoint→permission map;
#   - a FULL installation token (no permission-* inputs; the App grant is the
#     boundary) drives a second import + plan pair — the production model for
#     otterdog jobs, still read-only by behavior (import/plan only GET;
#     `otterdog apply` is never run).
# The App private key exists only as an Actions secret, so the probe must run
# inside GitHub Actions — triggered by a same-repo draft PR that touches this
# file, or by workflow_dispatch for reruns.
#
# The mechanism that makes App-only operation possible (otterdog 1.3.4 source):
# - `plan -n` (`--no-web-ui`) resolves credentials with `only_token=True`
#   (operations/diff_operation.py:132), so ONLY the api_token is needed.
# - `import -n` resolves FULL credentials regardless (operations/
#   import_configuration.py:78 calls get_credentials without only_token), but
#   never USES the web credentials: WebClient.__init__ only stores them
#   (providers/github/web.py), Playwright launches solely inside
#   WebClient.get_org_settings, and that call is gated by `if not no_web_ui`
#   (providers/github/__init__.py:113). Dummy username/password/twofa_seed
#   values therefore satisfy resolution and are provably never exercised.
# Running plan WITHOUT -n drives the real web machinery — the control step
# below proves that path demands non-App auth (browser + human account creds).
#
# Triggers: pull_request (only when THIS file changes) · workflow_dispatch
# Not part of managed CI and never merges (ADR-0007). Do not add to CHANGELOG.

name: Spike App auth (#16)

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - .github/workflows/spike-app-auth.yml
  workflow_dispatch:
    inputs:
      reason:
        description: Why this spike is being re-run (recorded in the log)
        required: false
        default: manual rerun

concurrency:
  group: spike-app-auth-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  probe:
    name: Probe App-token coverage (read-only)
    # ADR-0007 binding rule: never expose org-admin credentials to fork PRs.
    # Secrets are unavailable to fork PRs anyway; this is belt-and-braces.
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OTTERDOG_VERSION: "1.3.4"
      # Canonical Otterdog defaults library (pinned tag); base_template must be a
      # github.com URL (otterdog jsonnet.py enforces this).
      BASE_TEMPLATE: "https://github.com/EclipseFdn/otterdog-defaults#otterdog-defaults.libsonnet@v0.13.1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      # Read-only installation token, narrowed to the COMPLETE read surface the
      # otterdog 1.3.4 import/plan path touches (statically enumerated from its
      # source after run 29573601056 403'd on GET /orgs/vig-os/organization-roles
      # — the unconditional security_manager role-id lookup in
      # rest/org_client.py get_settings). Endpoint→permission mapping per
      # https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps
      #
      # KNOWN GAP (empirically probed by the import step): Actions VARIABLES
      # (org + repo) cannot be carried by a narrowed installation token at all —
      # GitHub's app-permissions schema (create-installation-access-token) has
      # no actions_variables / organization_actions_variables key, even though
      # the App settings UI can grant "Variables". The org-variables read
      # (GET /orgs/{org}/actions/variables) raises in otterdog, so import is
      # expected to fail THERE and nowhere earlier; repo-level variables /
      # secrets / environments reads are non-fatal (return [] on non-200).
      - name: Mint read-only App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          # Repo access scoped to this one repo (least privilege, zizmor-clean).
          # Org-level read scopes below are installation-wide regardless, so this
          # still exercises the full org+repo settings surface for the spike.
          repositories: org-config
          # -- repository permissions (read) --
          permission-metadata: read                        # repo list, topics, custom-property values, PVR
          permission-contents: read                        # fetch-config reads committed config
          permission-administration: read                  # repo settings, vuln alerts, code-scanning setup, actions perms, rulesets, BPRs (GraphQL)
          permission-actions: read                         # environments list (App mapping puts /environments under Actions)
          permission-pages: read                           # pages config
          permission-repository-hooks: read                # repo webhooks
          permission-secrets: read                         # repo Actions secrets (names only)
          permission-issues: read                          # drift-layer surface parity (unused by otterdog import/plan)
          # -- organization permissions (read) --
          permission-organization-administration: read     # org settings, org actions perms, installations, code-security defaults
          permission-organization-custom-org-roles: read   # GET /orgs/{org}/organization-roles (run-3 403)
          permission-organization-custom-properties: read  # org custom-property schema
          permission-organization-hooks: read              # org webhooks
          permission-organization-secrets: read            # org Actions secrets (names only)
          permission-members: read                         # teams, team members, role-assigned teams

      # FULL installation token — NO permission-* narrowing. It carries the
      # App's entire grant, including Actions Variables, which the narrowing
      # schema cannot express (gap above). This is the production model for
      # otterdog jobs: the App grant itself is the permission boundary and the
      # job stays read-only by BEHAVIOR (import/plan only issue GETs; apply is
      # a separate, environment-gated workflow — ADR-0007). `owner: vig-os`
      # makes the token org-wide because the import/drift sweep must see every
      # repo. zizmor's github-app finding on that line is acknowledged INLINE
      # as a deliberate, documented decision — do NOT move it to zizmor.yml,
      # where it would silently exempt future edits of this file.
      - name: Mint full App installation token (unnarrowed, org-wide)
        id: app-token-full
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: vig-os  # zizmor: ignore[github-app]

      - name: Write minimal Otterdog config (narrowed + full-token workdirs)
        env:
          WORKDIR: ${{ runner.temp }}/otterdog-spike
          WORKDIR_FULL: ${{ runner.temp }}/otterdog-spike-full
        run: |
          set -euo pipefail
          mkdir -p "$WORKDIR/logs" "$WORKDIR_FULL"
          cat > "$WORKDIR/otterdog.json" <<JSON
          {
            "defaults": {
              "jsonnet": {
                "base_template": "${BASE_TEMPLATE}",
                "config_dir": "orgs"
              },
              "github": {
                "config_repo": "org-config"
              }
            },
            "organizations": [
              {
                "name": "vig-os",
                "github_id": "vig-os",
                "config_repo": "org-config",
                "credentials": {
                  "provider": "env",
                  "api_token": "OTTERDOG_TOKEN",
                  "username": "SPIKE_DUMMY_USERNAME",
                  "password": "SPIKE_DUMMY_PASSWORD",
                  "twofa_seed": "SPIKE_DUMMY_TWOFA_SEED"
                }
              }
            ]
          }
          JSON
          # Identical config for the full-token probes, in its own workdir so
          # the two imports never clobber each other's orgs/ output.
          cp "$WORKDIR/otterdog.json" "$WORKDIR_FULL/otterdog.json"
          echo "Wrote $WORKDIR/otterdog.json (and copy in $WORKDIR_FULL):"
          cat "$WORKDIR/otterdog.json"

      - name: Run spike probes and build SPIKE REPORT
        env:
          # The env credential provider reads the token from this variable; the
          # value is the read-only App installation token minted above.
          OTTERDOG_TOKEN: ${{ steps.app-token.outputs.token }}
          # Full (unnarrowed) installation token for the second probe pair; the
          # probe step swaps it into OTTERDOG_TOKEN only for those invocations.
          OTTERDOG_TOKEN_FULL: ${{ steps.app-token-full.outputs.token }}
          WORKDIR_FULL: ${{ runner.temp }}/otterdog-spike-full
          # Dummy web credentials: `import` resolves full credentials even with
          # --no-web-ui (import_configuration.py:78, run 29573312085 failed with
          # "required key 'username' not found"), but never uses them on that
          # path (see header). Clearly-fake values keep the spike App-only.
          SPIKE_DUMMY_USERNAME: spike-dummy-unused
          SPIKE_DUMMY_PASSWORD: spike-dummy-unused
          SPIKE_DUMMY_TWOFA_SEED: spike-dummy-unused
          WORKDIR: ${{ runner.temp }}/otterdog-spike
        run: |
          # Strict mode guards the harness only. GitHub's default shell is
          # `bash -e {0}`; probe invocations run under a scoped `set +e` inside
          # run_probe so probe outcomes are report content, never step status —
          # the control probe is EXPECTED to fail without reddening the job.
          set -euo pipefail
          CFG="$WORKDIR/otterdog.json"
          CFG_FULL="$WORKDIR_FULL/otterdog.json"
          LOGDIR="$WORKDIR/logs"
          mkdir -p "$LOGDIR"
          # otterdog 1.3.4's `env` credential provider does `from dotenv import
          # load_dotenv`, but python-dotenv is missing from its published
          # dependency set (mintotp and playwright ARE declared) — without the
          # pinned --with injection every probe dies with
          # "No module named 'dotenv'" (spike run 29573080546).
          OTTER=(uvx --with python-dotenv==1.1.0 --from "otterdog@${OTTERDOG_VERSION}" otterdog)

          {
            echo "# SPIKE REPORT — App-token coverage of Otterdog settings (#16)"
            echo
            echo "- Otterdog: \`${OTTERDOG_VERSION}\` (via uvx)"
            echo "- Org: \`vig-os\` · credential provider: \`env\` (App installation token in \$OTTERDOG_TOKEN)"
            echo "- Token permissions requested (all read): repo metadata/contents/administration/actions/pages/repository-hooks/secrets/issues; org administration/custom-org-roles/custom-properties/hooks/secrets/members"
            echo "- NOT requestable: Actions Variables (org+repo) — no actions_variables / organization_actions_variables key in GitHub's app-permissions token-narrowing schema; expect the org-variables read to 403"
            echo "- Second token: FULL installation token (unnarrowed, org-wide) for the 'full token' probes — production model, read-only by behavior"
            echo "- Trigger: \`${GITHUB_EVENT_NAME}\`"
            echo
            echo "## Probe results"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # run_probe <label> <note> -- <command...>
          # Never aborts the step: the probe runs with errexit suspended, its
          # exit code is captured (also exported as LAST_PROBE_RC for gating),
          # its full log lands in $LOGDIR, and a PASS/FAIL section is appended
          # to the job summary. Always returns 0.
          LAST_PROBE_RC=0
          run_probe() {
            local label="$1"; local note="$2"; shift 3   # drop label, note, "--"
            local log="$LOGDIR/${label// /_}.log"
            local rc
            echo "::group::${label}"
            set +e
            "$@" >"$log" 2>&1
            rc=$?
            set -e
            LAST_PROBE_RC=$rc
            cat "$log"
            echo "::endgroup::"
            local status
            if [ "$rc" -eq 0 ]; then status="PASS (exit 0)"; else status="FAIL (exit $rc)"; fi
            {
              echo "### ${label} — ${status}"
              echo
              echo "${note}"
              echo
              echo '```text'
              tail -n 40 "$log"
              echo '```'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            return 0
          }

          # 1. Kept for the record, with a caveat: this otterdog check inspects
          #    the X-OAuth-Scopes response header, which only classic PATs carry.
          #    App installation tokens have fine-grained permissions and NO such
          #    header, so "empty granted scopes" here is expected and meaningless
          #    (run 29573312085) — it is NOT evidence of a missing permission.
          run_probe "check-token-permissions" \
            "CAVEAT — otterdog reads the X-OAuth-Scopes header, which exists only for classic PATs. App installation tokens never carry it, so empty/missing granted scopes here is EXPECTED and says nothing about App-token coverage. Kept only for the record; coverage evidence comes from the import/plan probes below." \
            -- "${OTTER[@]}" check-token-permissions -c "$CFG" -l vig-os

          # 2. fetch-config: mandated by #16. Pulls otterdog/vig-os.jsonnet from
          #    the config repo default branch — expected to FAIL until the config
          #    lands in #17. Run before import so it never clobbers import output.
          run_probe "fetch-config" \
            "Fetches committed config from the org-config default branch. Expected to fail pre-#17 (no otterdog/vig-os.jsonnet yet); an auth error here instead of 'not found' would be the signal." \
            -- "${OTTER[@]}" fetch-config -c "$CFG" vig-os

          # 3. import --no-web-ui: THE coverage probe. Reads the full LIVE
          #    org+repo settings surface via the App token (REST/GraphQL only) and
          #    writes orgs/vig-os.jsonnet. 403/404s here mark settings the token
          #    cannot read within the requested scopes. import resolves full
          #    credentials (import_configuration.py:78) — the dummy web creds
          #    satisfy that — but with --no-web-ui the web client is never used
          #    (get_org_settings gated at providers/github/__init__.py:113), so
          #    the API reads are App-token-only.
          run_probe "import (--no-web-ui)" \
            "Reads the full live settings surface with the App token only and generates the local config. Dummy web credentials satisfy otterdog's unconditional credential resolution but are provably never used with --no-web-ui. HTTP 403/404 lines = settings outside App reach or requested scopes. If this fails ONLY at GET /orgs/vig-os/actions/variables, the narrowed-token Variables gap is confirmed and everything else is App-covered (repo-level variables/secrets/environments read failures are silently tolerated by otterdog and show up as empty lists instead)." \
            -- "${OTTER[@]}" import -c "$CFG" --no-web-ui -f vig-os
          IMPORT_RC=$LAST_PROBE_RC

          # 4. plan --no-web-ui: mandated by #16. Diffs the imported local config
          #    against live using only_token=True (App token only). Should show
          #    little/no drift if import succeeded — THE App-only-plan
          #    confirmation. Gated: without a successful import there is no local
          #    config to diff, so the probe would only re-report import's failure.
          if [ "$IMPORT_RC" -eq 0 ]; then
            run_probe "plan (--no-web-ui)" \
              "Diffs the just-imported local config against live with the App token only (only_token=True, diff_operation.py:132). Little/no drift expected — this is the critical App-only-plan confirmation." \
              -- "${OTTER[@]}" plan -c "$CFG" --no-web-ui vig-os
          else
            {
              echo "### plan (--no-web-ui) — SKIPPED"
              echo
              echo "Skipped: import failed (exit ${IMPORT_RC}), so no local config exists to diff."
              echo "Fix the import failure first — this probe is the critical App-only-plan confirmation."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # 5. CONTROL: plan WITHOUT --no-web-ui. Credential resolution now
          #    succeeds (dummy web creds), so the failure moves into the web
          #    machinery itself: Playwright browser launch / GitHub web login,
          #    which needs a real human account + TOTP. Expected to FAIL —
          #    empirical proof that the web-UI settings demand non-App auth.
          run_probe "plan (web-ui, control)" \
            "CONTROL — plan without --no-web-ui exercises the web-UI path (Playwright + username/password/TOTP). With dummy creds it fails inside the web machinery (browser launch or GitHub login). Expected FAIL: proves the 12 web-UI settings need non-App auth." \
            -- "${OTTER[@]}" plan -c "$CFG" vig-os

          # 6. import with the FULL (unnarrowed) installation token: the
          #    production model. The App grant is the permission boundary, so
          #    this carries Actions Variables too — expected FULL SUCCESS once
          #    the App's permission set is updated. Its orgs/ output is uploaded
          #    in the artifact and seeds the committed config (#17).
          run_probe "import (full token, --no-web-ui)" \
            "Same read path, but with the UNNARROWED installation token (App grant = boundary, incl. Actions Variables). Expected full success after the App permission update — this side of the asymmetry is the production model; its orgs/ output seeds #17." \
            -- env OTTERDOG_TOKEN="${OTTERDOG_TOKEN_FULL}" "${OTTER[@]}" import -c "$CFG_FULL" --no-web-ui -f vig-os
          FULL_IMPORT_RC=$LAST_PROBE_RC

          # 7. plan with the FULL token against the just-imported config: the
          #    end-to-end App-only-plan proof. Gated on probe 6 succeeding.
          if [ "$FULL_IMPORT_RC" -eq 0 ]; then
            run_probe "plan (full token, --no-web-ui)" \
              "Diffs the full-token import against live with the same unnarrowed token (only_token=True — web creds still never used). Little/no drift expected: this is the end-to-end App-only-plan proof for the production model." \
              -- env OTTERDOG_TOKEN="${OTTERDOG_TOKEN_FULL}" "${OTTER[@]}" plan -c "$CFG_FULL" --no-web-ui vig-os
          else
            {
              echo "### plan (full token, --no-web-ui) — SKIPPED"
              echo
              echo "Skipped: full-token import failed (exit ${FULL_IMPORT_RC}), so no local config exists to diff."
              echo "A failure HERE (unlike the narrowed probe) is unexpected and means an App grant is still missing."
              echo
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          # Static enumeration from otterdog 1.3.4 resources/schemas/settings.json
          # (properties with "provider": "web"): the org settings that are NEVER
          # reachable with an App token — only via the web UI (Playwright + a human
          # account's username/password/TOTP).
          {
            echo "## Non-App settings surface (web-UI only) — from otterdog ${OTTERDOG_VERSION} schema"
            echo
            echo "These 12 org settings carry \`\"provider\": \"web\"\` and are fetched/updated"
            echo "by browser automation, NOT the REST API. An App token cannot read or write"
            echo "them; \`--no-web-ui\` skips them (and the control step above fails without web creds):"
            echo
            echo "| Org setting (web-UI only) |"
            echo "| --- |"
            for k in \
              default_branch_name \
              discussion_source_repository \
              has_discussions \
              members_can_change_project_visibility \
              members_can_change_repo_visibility \
              members_can_create_teams \
              members_can_delete_issues \
              members_can_delete_repositories \
              packages_containers_internal \
              packages_containers_public \
              readers_can_create_discussions \
              two_factor_requirement ; do
              echo "| \`$k\` |"
            done
            echo
            echo "**Decision input for ADR-0004:** manage-vs-exclude each of the above."
            echo "App-only governance covers everything else; these 12 are either excluded"
            echo "from managed config or set once by hand (org-singletons, plan-only per ADR-0007)."
            echo
            echo "## Token-narrowing gap — Actions Variables"
            echo
            echo "GitHub's \`app-permissions\` schema (the \`permissions\` object of"
            echo "POST /app/installations/{id}/access_tokens, per github/rest-api-description)"
            echo "has NO key for Actions Variables (\`actions_variables\` /"
            echo "\`organization_actions_variables\` do not exist), although the App settings UI"
            echo "can grant \"Variables\" and unnarrowed tokens then carry it. Consequence for"
            echo "ADR-0004's per-job narrowed tokens: a narrowed plan/drift token can NEVER read"
            echo "org/repo Actions variables. The dual-token probes above show both sides of the"
            echo "asymmetry: narrowed import fails at the org-variables read; full-token import"
            echo "covers the entire non-web surface."
            echo
            echo "## DECISION (for ADR-0004 Corrections log)"
            echo
            echo "**Narrowed-vs-full asymmetry:** a narrowed installation token cannot carry"
            echo "Actions Variables (schema gap above), so per-job narrowing cannot cover the"
            echo "otterdog read surface. **Production otterdog jobs (plan / drift / apply) use"
            echo "the FULL installation token — the App's own grant is the permission boundary;"
            echo "narrowing is reserved for the drift-layer issue operations** (issues:read/write"
            echo "only), which the schema expresses fine. Read-only-ness of plan/drift is then"
            echo "enforced by behavior (GET-only otterdog operations, no apply) and by the"
            echo "environment gate on apply (ADR-0007), not by token permissions. Record this in"
            echo "ADR-0004's Corrections log."
          } >> "$GITHUB_STEP_SUMMARY"

      # Both workdirs: the narrowed import's partial output (if any) plus the
      # full-token import's orgs/ tree — the latter seeds the committed config
      # in #17. Path prefixes keep the two trees apart inside the artifact.
      - name: Upload fetched/imported configs and probe logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: spike-app-auth-vig-os-config-and-logs
          path: |
            ${{ runner.temp }}/otterdog-spike/orgs/
            ${{ runner.temp }}/otterdog-spike/logs/
            ${{ runner.temp }}/otterdog-spike/otterdog.json
            ${{ runner.temp }}/otterdog-spike-full/orgs/
            ${{ runner.temp }}/otterdog-spike-full/otterdog.json
          if-no-files-found: warn
          retention-days: 14
