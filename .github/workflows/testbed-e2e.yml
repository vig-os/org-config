# L3 mutation E2E harness — the one DESTRUCTIVE test layer (ADR-0007 Axis C,
# issue #23). It exercises the full drift lifecycle end to end against the
# SACRIFICIAL `org-config-testbed` repo (declared in
# `otterdog/vig-os/vig-os.jsonnet`): induce out-of-band drift, reconcile it into
# a `drift`+`critical` issue with the REAL in-house drift layer, prove
# update-not-duplicate on recurrence, revert, prove auto-close. This dogfoods the
# exact plan+reconcile path drift.yml runs in production (ADR-0002 issue-only
# drift), never a mock.
#
# NEVER PER-PR (ADR-0007 L3): scheduled + manual only. `schedule` and
# `workflow_dispatch` never carry fork-supplied code, so the org-admin App token
# is never exposed to a fork (OWASP CICD-SEC-4, Poisoned Pipeline Execution); the
# `if:` on the job asserts repo identity belt-and-braces. No `pull_request_target`;
# the default checkout is read-only (`persist-credentials: false`).
#
# SERIALIZED WITH APPLY + DRIFT (ADR-0007 BINDING): this run JOINS the same static
# `otterdog-mutate` concurrency group as apply.yml and drift.yml, with
# `cancel-in-progress: false`. This harness mutates live repo state (description
# flips, an ephemeral stray repo) AND runs the reconciler, so it must never race
# an apply or a drift run — a reconciler racing a mutation manufactures phantom
# drift.
#
# This is a repo-OWNED workflow (not devkit-managed), so zizmor gates it in full:
# it is deliberately ABSENT from zizmor.yml, and the only accepted findings are
# the two scoped, justified `github-app` inline ignores on the full plan/admin
# token (same pattern as plan/apply/drift). Everything else must be fixed here.
#
# Two least-privilege App tokens, each minted for exactly its leg (ADR-0004):
#   * FULL, unnarrowed, org-wide installation token — the otterdog read surface
#     needs it (a narrowed token cannot carry Actions Variables; org-variables
#     read is fatal on 403 — ADR-0004 Corrections, spike #16). It also carries
#     the repo Administration:write used to flip the testbed description and to
#     create/delete the ephemeral stray. Read-only-ness of the plan leg is
#     enforced by BEHAVIOR: `plan` only issues GETs.
#   * SECOND token narrowed to `issues: write` on org-config only — the smallest
#     grant the drift layer's issue ops (and the harness's issue reads) need.
#
# Idempotent cleanup (ADR-0007): an `if: always()` step restores the declared
# description and removes any lingering stray, so a crashed run never leaves the
# testbed drifted or an orphan repo in the org.
#
# DEFAULT-BRANCH REGISTRATION / ACTIVATION MODEL (devkit release model): GitHub
# registers `schedule` and `workflow_dispatch` triggers ONLY from a repo's
# DEFAULT branch — here trunk `main` (#63 trunk model: `main` is the single
# branch, where this file is both developed AND applied). So this harness is
# REGISTERED once this file lands on `main`: from then the weekly cron below and
# `workflow_dispatch` can fire (M3 acceptance evidence is provided independently
# by the disposable `e2e-verification-spike.yml`, which runs this same harness on
# a draft PR). (Pre-trunk, under gitflow, registration waited on the first
# release promoting the file from `dev` onto `main`; the trunk switch collapses
# that dev/main split, so there is no release gap left to bridge.)
#
# CHECKOUT REF IS THE DEFAULT (`main`): under the trunk model `main` is both
# where GitHub registers this workflow's triggers AND where the DATA and code it
# must operate on live — the committed `otterdog/` config (the jsonnet the
# description-sync guard greps), the `src/drift_layer/` Python, the allow-list,
# and the `justfile.project` otterdog pin. So the default `actions/checkout` ref
# (the triggering ref, `main`) is exactly the tree to run against; NO explicit
# `ref:` pin is needed. (The old gitflow `ref: dev` pin bridged a released-`main`
# workflow to dev-resident config between releases; that split is gone under
# trunk, so the pin is removed.)

name: Testbed E2E

on:  # yamllint disable-line rule:truthy
  schedule:
    # Weekly, Monday 05:23 UTC — deliberately away from drift.yml's daily 03:17
    # so the L3 harness and the routine drift scan never collide on the clock
    # (the concurrency group serializes them regardless; this just avoids the
    # queue wait).
    - cron: "23 5 * * 1"
  workflow_dispatch:
    inputs:
      run_stray_sweep:
        description: >-
          Also run the stray-repo sweep leg (creates and deletes an ephemeral
          org-config-testbed-stray). Default OFF — only enable to exercise the
          undeclared-repo sweep (#21).
        type: boolean
        default: false

# Join the cross-workflow mutation group so this harness, apply, and drift
# serialize and never cancel each other mid-run (ADR-0007). Same group name as
# apply.yml / drift.yml.
concurrency:
  group: otterdog-mutate
  cancel-in-progress: false

permissions: {}

env:
  OWNER: vig-os
  TESTBED: org-config-testbed
  STRAY: org-config-testbed-stray
  # The drift resource identity of the testbed (the reconciler titles its issue
  # `Drift: <resource>`). Exact-matched in assertions so it never collides with
  # the `org-config-testbed-stray` substring.
  TESTBED_RESOURCE: 'repository[name="org-config-testbed"]'
  # Single source of truth: this MUST equal the `description` declared for
  # `org-config-testbed` in otterdog/vig-os/vig-os.jsonnet (a guard step greps
  # for it). The harness reverts induced drift back to this declared value.
  TESTBED_DESCRIPTION: 'SACRIFICIAL testbed for the L3 mutation E2E harness (issue #23) - its live settings are deliberately churned and reverted by .github/workflows/testbed-e2e.yml on every run; do not rely on any state here.'

jobs:
  e2e:
    name: L3 mutation E2E on org-config-testbed
    # ADR-0007 BINDING: runs only on this repo (scheduled/manual events do not
    # originate from forks); explicit for clarity.
    if: github.repository == 'vig-os/org-config'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions: {}
    steps:
      - name: Checkout repository
        # Default checkout ref (the triggering ref, trunk `main`): under the
        # trunk model `main` is both where GitHub registers this schedule/
        # dispatch and where the config, drift-layer code, allow-list, and
        # otterdog pin live, so the default ref is exactly the tree to run
        # against — see the header. No `ref:` pin needed.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0

      # Otterdog version pin: justfile.project (`otterdog_version`) is the single
      # source of truth (ADR-0005); read it here so CI never carries a second,
      # drift-prone copy of the pin.
      - name: Resolve otterdog version pin
        run: |
          set -euo pipefail
          version="$(grep -oP 'otterdog_version\s*:=\s*"\K[^"]+' justfile.project)"
          if [ -z "${version}" ]; then
            echo "::error::could not resolve otterdog_version from justfile.project"
            exit 1
          fi
          echo "OTTERDOG_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved otterdog version: ${version}"

      # SSoT guard: the description the harness reverts to (env TESTBED_DESCRIPTION)
      # must be the exact string declared in the jsonnet, or a revert would itself
      # manufacture drift. Fail loudly if they diverge.
      - name: Guard - declared description matches the jsonnet
        run: |
          set -euo pipefail
          if ! grep -qF -- "${TESTBED_DESCRIPTION}" otterdog/vig-os/vig-os.jsonnet; then
            echo "::error::TESTBED_DESCRIPTION does not match the org-config-testbed description in otterdog/vig-os/vig-os.jsonnet; update both to keep the revert value in sync."
            exit 1
          fi
          echo "Declared description is in sync with the jsonnet."

      # FULL installation token — NO permission-* narrowing (ADR-0004
      # Corrections): the App grant is the boundary; a narrowed token cannot read
      # Actions Variables. `owner: vig-os` makes it org-wide (plan must see every
      # repo; admin calls target testbed/stray). zizmor's github-app finding on
      # the broad token is an acknowledged, deliberate decision recorded INLINE.
      - name: Mint full App installation token (unnarrowed, org-wide)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: vig-os  # zizmor: ignore[github-app]

      # SECOND token, narrowed to issues:write on org-config only — the smallest
      # grant the drift layer's issue ops (and the harness's issue reads) need.
      - name: Mint narrowed App token for issue ops (issues:write, this repo)
        id: issues-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: vig-os
          repositories: org-config
          permission-issues: write

      # Skip gracefully if the first environment-gated apply has not created the
      # testbed yet: it is declared in config and the apply that dogfoods this
      # repo mints it. Until then there is nothing to mutate — the job stays green
      # and the summary explains why.
      - name: Guard - testbed repo exists
        id: guard
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          if gh api "repos/${OWNER}/${TESTBED}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Testbed ${OWNER}/${TESTBED} exists; proceeding with the L3 harness."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Testbed ${OWNER}/${TESTBED} not found; the first apply has not created it yet. Skipping gracefully."
          fi

      # The drift leg = the exact production path (drift.yml): read-only full-org
      # `otterdog plan --local --no-web-ui` -> the in-house `drift-layer`
      # reconciler writing deduplicated drift+critical issues into org-config.
      # Written once, invoked at each lifecycle stage. It reads OTTERDOG_TOKEN
      # (full app token), GITHUB_TOKEN (narrowed issues token), and
      # OTTERDOG_VERSION from the environment set by the caller.
      - name: Prepare drift-leg helper
        if: steps.guard.outputs.exists == 'true'
        run: |
          set -euo pipefail
          cat > "${RUNNER_TEMP}/drift_leg.sh" <<'LEG'
          #!/usr/bin/env bash
          set -uo pipefail
          OTTER=(uvx --with python-dotenv==1.1.0 --from "otterdog@${OTTERDOG_VERSION}" otterdog)
          "${OTTER[@]}" plan --local --no-web-ui -c otterdog.json vig-os >plan.txt 2>&1
          rc=$?
          echo "otterdog plan exited ${rc}"
          if [ "${rc}" != "0" ]; then
            echo "::error::otterdog plan failed (exit ${rc}) - not drift; check config/auth/harness"
            cat plan.txt
            exit 1
          fi
          uv run drift-layer \
            --plan-file plan.txt \
            --repo "${GITHUB_REPOSITORY}" \
            --org vig-os \
            --allowlist drift-allowlist.toml
          LEG
          chmod +x "${RUNNER_TEMP}/drift_leg.sh"
          echo "drift-leg helper written to ${RUNNER_TEMP}/drift_leg.sh"

      # Core lifecycle + assertions in one step so per-stage state (issue number,
      # comment counts) stays in local shell vars. Every assertion appends a row
      # (PASS/FAIL + evidence) to the results file for the summary; the step exits
      # nonzero iff any assertion failed, so the job goes red on failure. The
      # always-revert cleanup below restores state even if this aborts mid-way.
      - name: Testbed drift lifecycle and assertions
        if: steps.guard.outputs.exists == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUES_TOKEN: ${{ steps.issues-token.outputs.token }}
          # drift-layer reads GITHUB_TOKEN; give it the narrowed issues token.
          GITHUB_TOKEN: ${{ steps.issues-token.outputs.token }}
          OTTERDOG_TOKEN: ${{ steps.app-token.outputs.token }}
          OTTERDOG_DUMMY_USERNAME: testbed-dummy-unused
          OTTERDOG_DUMMY_PASSWORD: testbed-dummy-unused
          OTTERDOG_DUMMY_TWOFA_SEED: testbed-dummy-unused
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          set -uo pipefail
          RESULTS="${RUNNER_TEMP}/results.md"
          : > "${RESULTS}"
          FAILED=0
          EXPECTED_TITLE="Drift: ${TESTBED_RESOURCE}"

          record() {  # $1=PASS|FAIL  $2=assertion  $3=evidence
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${RESULTS}"
            echo "[$1] $2 -- $3"
            if [ "$1" = "FAIL" ]; then FAILED=1; fi
          }

          run_leg() {
            if ! bash "${RUNNER_TEMP}/drift_leg.sh"; then
              record FAIL "drift leg (otterdog plan + reconcile) ran cleanly" "leg exited nonzero - see log"
              return 1
            fi
          }

          list_open_testbed() {  # -> JSON array of {number, labels[]} for the testbed issue
            GH_TOKEN="${ISSUES_TOKEN}" gh issue list --repo "${OWNER}/org-config" \
              --state open --limit 200 --json number,title,labels 2>/dev/null \
              | jq --arg t "${EXPECTED_TITLE}" \
                  '[.[] | select(.title == $t) | {number, labels: [.labels[].name]}]' 2>/dev/null \
              || echo '[]'
          }
          comment_count() {  # $1=issue number
            GH_TOKEN="${ISSUES_TOKEN}" gh api "repos/${OWNER}/org-config/issues/$1/comments" \
              --jq 'length' 2>/dev/null || echo 0
          }
          issue_state() {  # $1=issue number
            GH_TOKEN="${ISSUES_TOKEN}" gh api "repos/${OWNER}/org-config/issues/$1" \
              --jq '.state' 2>/dev/null || echo unknown
          }

          # --- 1. Induce benign out-of-band drift: flip the description ---------
          SENTINEL="[DRIFT-E2E ${GITHUB_RUN_ID}] induced out-of-band flip; auto-reverted"
          if GH_TOKEN="${APP_TOKEN}" gh api -X PATCH "repos/${OWNER}/${TESTBED}" \
               -f description="${SENTINEL}" >/dev/null; then
            echo "Induced drift: testbed description flipped to a sentinel."
          else
            record FAIL "induce out-of-band drift (description flip)" "PATCH failed"
          fi

          # --- 2. Reconcile: exactly one drift+critical issue for the testbed ---
          run_leg
          hits="$(list_open_testbed)"
          c1="$(echo "${hits}" | jq 'length' 2>/dev/null || echo 0)"
          n1="$(echo "${hits}" | jq -r '.[0].number // empty' 2>/dev/null || echo '')"
          has_labels="$(echo "${hits}" | jq -r 'if (.[0].labels | index("drift")) and (.[0].labels | index("critical")) then "yes" else "no" end' 2>/dev/null || echo no)"
          if [ "${c1}" = "1" ] && [ -n "${n1}" ] && [ "${has_labels}" = "yes" ]; then
            record PASS "Exactly one drift+critical issue opened for the testbed" "issue #${n1}, count=${c1}, labels=drift+critical"
          else
            record FAIL "Exactly one drift+critical issue opened for the testbed" "count=${c1}, number=${n1:-none}, labels_ok=${has_labels}"
          fi
          cc1="$( [ -n "${n1}" ] && comment_count "${n1}" || echo 0 )"

          # --- 3. Rerun with drift still present: update, never duplicate -------
          run_leg
          hits="$(list_open_testbed)"
          c2="$(echo "${hits}" | jq 'length' 2>/dev/null || echo 0)"
          n2="$(echo "${hits}" | jq -r '.[0].number // empty' 2>/dev/null || echo '')"
          if [ "${c2}" = "1" ] && [ -n "${n2}" ] && [ "${n2}" = "${n1}" ]; then
            record PASS "Rerun updates the same issue in place (no duplicate)" "still #${n2}, count=${c2}"
          else
            record FAIL "Rerun updates the same issue in place (no duplicate)" "count=${c2}, number=${n2:-none}, expected #${n1:-none}"
          fi
          cc2="$( [ -n "${n2}" ] && comment_count "${n2}" || echo 0 )"
          if [ "${cc2:-0}" -gt "${cc1:-0}" ]; then
            record PASS "Recurrence comment appended on rerun" "comments ${cc1} -> ${cc2}"
          else
            record FAIL "Recurrence comment appended on rerun" "comments ${cc1} -> ${cc2}"
          fi

          # --- 4. Revert to the declared description ----------------------------
          if GH_TOKEN="${APP_TOKEN}" gh api -X PATCH "repos/${OWNER}/${TESTBED}" \
               -f description="${TESTBED_DESCRIPTION}" >/dev/null; then
            echo "Reverted testbed description to the declared value."
          else
            record FAIL "revert testbed description to declared value" "PATCH failed"
          fi

          # --- 5. Rerun with drift resolved: the issue auto-closes --------------
          run_leg
          hits="$(list_open_testbed)"
          c3="$(echo "${hits}" | jq 'length' 2>/dev/null || echo 0)"
          s3="$( [ -n "${n1}" ] && issue_state "${n1}" || echo unknown )"
          if [ "${c3}" = "0" ] && [ "${s3}" = "closed" ]; then
            record PASS "Issue auto-closes after the divergence is resolved" "#${n1:-none} state=${s3}, open testbed issues=${c3}"
          else
            record FAIL "Issue auto-closes after the divergence is resolved" "#${n1:-none} state=${s3}, open testbed issues=${c3}"
          fi

          echo "lifecycle FAILED=${FAILED}"
          [ "${FAILED}" = "0" ]

      # Optional, default-OFF: stray-repo sweep leg. Creates an UNDECLARED
      # org-config-testbed-stray via the App token, gives the sweep (#21) a chance
      # to flag it, then deletes it and asserts the sweep issue closes. The sweep
      # is a future mechanism (#21): if it is not deployed (or does not flag the
      # stray), the assertion degrades gracefully to a SKIP and the stray is still
      # cleaned up. Repo-deletion capability: the App holds repo Administration:
      # write (it creates/configures every managed repo and otterdog's
      # --delete-resources deletes repos with this token), and `DELETE
      # /repos/{owner}/{repo}` needs exactly that — so create-and-delete is
      # covered. The delete step still degrades to a loud manual-delete
      # instruction if the API ever rejects it, so an orphan can never go unnoticed.
      - name: Stray-repo sweep leg (opt-in)
        if: steps.guard.outputs.exists == 'true' && github.event_name == 'workflow_dispatch' && inputs.run_stray_sweep
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUES_TOKEN: ${{ steps.issues-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.issues-token.outputs.token }}
          OTTERDOG_TOKEN: ${{ steps.app-token.outputs.token }}
          OTTERDOG_DUMMY_USERNAME: testbed-dummy-unused
          OTTERDOG_DUMMY_PASSWORD: testbed-dummy-unused
          OTTERDOG_DUMMY_TWOFA_SEED: testbed-dummy-unused
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          set -uo pipefail
          RESULTS="${RUNNER_TEMP}/results.md"
          FAILED=0
          record() {
            printf '| %s | %s | %s |\n' "$1" "$2" "$3" >> "${RESULTS}"
            echo "[$1] $2 -- $3"
            if [ "$1" = "FAIL" ]; then FAILED=1; fi
          }

          # --- Create the undeclared stray -------------------------------------
          if GH_TOKEN="${APP_TOKEN}" gh api -X POST "orgs/${OWNER}/repos" \
               -f name="${STRAY}" -F private=false \
               -f description="Ephemeral stray for the sweep E2E (#23) - auto-deleted" >/dev/null 2>&1; then
            record PASS "Created undeclared stray repo via the App token" "${OWNER}/${STRAY}"
          else
            record FAIL "Created undeclared stray repo via the App token" "POST orgs/${OWNER}/repos failed"
          fi

          # --- Give any deployed sweep (#21) a chance to flag it ----------------
          bash "${RUNNER_TEMP}/drift_leg.sh" || true
          sweep_hits="$(GH_TOKEN="${ISSUES_TOKEN}" gh issue list --repo "${OWNER}/org-config" \
            --state open --limit 200 --json number,title,body 2>/dev/null \
            | jq --arg s "${STRAY}" '[.[] | select((.title | contains($s)) or ((.body // "") | contains($s)))]' 2>/dev/null || echo '[]')"
          sweep_count="$(echo "${sweep_hits}" | jq 'length' 2>/dev/null || echo 0)"
          assert_close=0
          sweep_num=""
          if [ "${sweep_count:-0}" -ge 1 ]; then
            sweep_num="$(echo "${sweep_hits}" | jq -r '.[0].number' 2>/dev/null || echo '')"
            record PASS "Sweep flagged the undeclared stray repo" "issue #${sweep_num} (count=${sweep_count})"
            assert_close=1
          else
            printf '| SKIP | Sweep flags the undeclared stray repo | sweep (#21) not deployed or did not flag %s; degrading gracefully, stray still cleaned up |\n' "${STRAY}" >> "${RESULTS}"
            echo "Sweep (#21) not deployed or did not flag the stray; degrading gracefully."
          fi

          # --- Delete the stray (capability verified above) --------------------
          if GH_TOKEN="${APP_TOKEN}" gh api -X DELETE "repos/${OWNER}/${STRAY}" >/dev/null 2>&1; then
            record PASS "Deleted the stray repo via the App token" "DELETE repos/${OWNER}/${STRAY}"
            if [ "${assert_close}" = "1" ] && [ -n "${sweep_num}" ]; then
              bash "${RUNNER_TEMP}/drift_leg.sh" || true
              state="$(GH_TOKEN="${ISSUES_TOKEN}" gh api "repos/${OWNER}/org-config/issues/${sweep_num}" --jq '.state' 2>/dev/null || echo unknown)"
              if [ "${state}" = "closed" ]; then
                record PASS "Sweep issue closes after the stray is deleted" "#${sweep_num} state=${state}"
              else
                record FAIL "Sweep issue closes after the stray is deleted" "#${sweep_num} state=${state}"
              fi
            fi
          else
            record FAIL "Deleted the stray repo via the App token - MANUAL DELETE REQUIRED" "DELETE rejected; run: gh repo delete ${OWNER}/${STRAY} --yes"
          fi

          echo "stray FAILED=${FAILED}"
          [ "${FAILED}" = "0" ]

      # Idempotent cleanup (ADR-0007): always restore the declared description and
      # remove any lingering stray, even if an assertion step aborted mid-way.
      # Best-effort — never fails the job; it only warns so a red run's cause
      # stays the assertion, not the cleanup.
      - name: Cleanup - restore declared state
        if: always() && steps.guard.outputs.exists == 'true'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -uo pipefail
          if GH_TOKEN="${APP_TOKEN}" gh api -X PATCH "repos/${OWNER}/${TESTBED}" \
               -f description="${TESTBED_DESCRIPTION}" >/dev/null 2>&1; then
            echo "cleanup: testbed description restored to the declared value."
          else
            echo "cleanup: WARNING could not restore the testbed description; check ${OWNER}/${TESTBED}."
          fi
          if GH_TOKEN="${APP_TOKEN}" gh api "repos/${OWNER}/${STRAY}" >/dev/null 2>&1; then
            if GH_TOKEN="${APP_TOKEN}" gh api -X DELETE "repos/${OWNER}/${STRAY}" >/dev/null 2>&1; then
              echo "cleanup: lingering stray ${OWNER}/${STRAY} deleted."
            else
              echo "cleanup: WARNING lingering stray ${OWNER}/${STRAY} could not be deleted - delete manually: gh repo delete ${OWNER}/${STRAY} --yes"
            fi
          fi

      # PASS/FAIL summary with per-assertion evidence (or the graceful-skip note).
      - name: E2E summary
        if: always()
        env:
          GUARD_EXISTS: ${{ steps.guard.outputs.exists }}
        run: |
          set -uo pipefail
          RESULTS="${RUNNER_TEMP}/results.md"
          {
            echo "## L3 mutation E2E — \`org-config-testbed\`"
            echo
            if [ "${GUARD_EXISTS}" != "true" ]; then
              echo "> **Skipped (no mutations performed).** The testbed repo \`${OWNER}/${TESTBED}\` does not exist yet."
              echo ">"
              echo "> It is declared in \`otterdog/vig-os/vig-os.jsonnet\` and is created by the first environment-gated \`apply\`. Re-run this harness after that apply lands."
            else
              echo "_Out-of-band drift induced on the sacrificial testbed, reconciled by the real \`drift-layer\` into org-config issues (ADR-0002 issue-only), then reverted and cleaned up (ADR-0007 L3). Nothing here is org-level._"
              echo
              echo "| Result | Assertion | Evidence |"
              echo "| --- | --- | --- |"
              if [ -s "${RESULTS}" ]; then
                cat "${RESULTS}"
              else
                echo "| FAIL | harness produced results | the lifecycle step did not run to completion |"
              fi
            fi
            echo
            echo "[Run log](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
          } >> "$GITHUB_STEP_SUMMARY"
