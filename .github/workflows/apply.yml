# Apply-on-merge — mutating `otterdog apply` of the committed config against live
# `vig-os`, run from trunk `main` after a config change merges (issue #19, #63
# trunk model: `main` is the single applied-state branch).
#
# This is a repo-OWNED workflow (not devkit-managed), so zizmor gates it in full:
# it is deliberately absent from zizmor.yml, and the only accepted findings are
# the two scoped, justified `github-app` inline ignores below. Everything else
# must be fixed here, not baselined.
#
# HUMAN GATE ON MUTATIONS (ADR-0007 §Public-repo credential rules, BINDING):
#   - The job runs in the `production` environment, which on this repo requires
#     reviewer `c-vigo` and restricts deployments to the `main` branch. Entering
#     that environment pauses the run until the reviewer approves — this wait IS
#     the designed manual gate before any write token touches live `vig-os`. No
#     `apply` mutates without a human first approving the deployment.
#   - `apply` runs ONLY from trunk `main`: `push` events fire on this repo, never
#     on a fork (a fork cannot push to the base repo), so org-admin credentials
#     are never exposed to fork code (OWASP CICD-SEC-4, Poisoned Pipeline
#     Execution). The `if:` below asserts the repo identity as belt-and-braces.
#   - Least-privilege `permissions: contents: read` — the job only reads the
#     committed config; all write capability rides the App installation token,
#     not GITHUB_TOKEN.
#
# SERIALIZED MUTATIONS (ADR-0007 BINDING): the static `otterdog-mutate`
# concurrency group with `cancel-in-progress: false` means overlapping applies
# queue and run one at a time, never cancelling a run mid-mutation. The future
# scheduled drift workflow (#20/#21) MUST declare this SAME `otterdog-mutate`
# group so apply-vs-drift is serialized too — a reconciler racing itself (or a
# concurrent apply) manufactures phantom drift.
#
# SUPERSESSION GUARD (#105): the environment approval gates the RUN, not the
# TREE. Applies queue behind the approval wait, so a later merge to the applied
# branch can supersede a still-waiting run — approving that older run would
# mutate live toward a config that is no longer on trunk (incident #99: an
# approved stale tree recreated three intentionally deleted repos as stubs).
# Two defenses:
#   - the ungated, read-only `preview` job below runs the EXACT tree's plan
#     into this run's job summary, so the approver can inspect the pending
#     mutation before approving (this repo's own events only);
#   - the gated job's FIRST step re-checks that `github.sha` is still the tip
#     of the applied branch and neutral-skips the entire apply otherwise — the
#     newer queued run carries the superseded delta. Consequence: re-running an
#     old run can never apply an old tree; to re-apply the CURRENT state, use
#     `workflow_dispatch` for a fresh run.
#
# Trigger scope: only `otterdog.json` / `otterdog/**` and the SOPS secret sources
# (`secrets/**`, `.sops.yaml`) change apply anything — rotating a secret value
# (#22, ADR-0003) is a normal PR that must re-apply. Engine or workflow edits
# carry no config delta, so they are deliberately NOT in `paths:` — editing this
# file does not trigger an apply. `workflow_dispatch` covers manual reruns.
#
# SECRETS-AS-CODE (issue #22, ADR-0003, BINDING): committed ciphertext under
# `secrets/*.yaml` is decrypted IN-MEMORY here and never logged. otterdog has
# exactly one offline secret-VALUE resolver — the `pass` credential provider
# (config.py `CredentialResolver.get_secret` routes a `pass:<path>` value to
# `PassVault.get_secret`, which shells `pass <path>`; the `env` provider that
# carries the API token raises for secret values). So each decrypted value is
# loaded into a throwaway, passphrase-less GPG-backed `pass` store generated on
# this runner and discarded with it — it adds NO bootstrap secret (only
# `SOPS_AGE_KEY` and the App key stay bootstrap items). Values are masked
# (`::add-mask::`) and never echoed (no `set -x` over secret vars).
#
# Auth (ADR-0004 Corrections, spike #16): otterdog's write surface needs the
# FULL App installation token — a narrowed token cannot carry Actions Variables
# (GitHub's token-narrowing schema has no key for them), and otterdog's
# org-variables read is fatal on 403. The App grant is the permission boundary;
# write capability is scoped to this one environment-gated, serialized job, per
# ADR-0004's "write only in `apply`".
#
# Non-interactive apply (otterdog 1.3.4, verified from installed source):
#   - `--force` (`-f`) is MANDATORY. Without it, `ApplyOperation.handle_finish`
#     (operations/apply.py:110-121) prompts "Do you want to perform these
#     actions?" and blocks on `get_approval()` -> `input()` (utils.py:581);
#     under CI stdin the read hits EOF and the process aborts (exit 2) without
#     applying. `--force` sets `force_processing=True` (cli.py apply option
#     -f/--force), skipping the prompt so the apply runs unattended.
#   - `--no-web-ui` (`-n`) skips the 12 web-UI-only settings no App token can
#     reach (ADR-0004 Corrections) and resolves credentials token-only, so the
#     dummy web-cred vars are never exercised (same as plan).
#   - `--local` gates ONLY the vendor re-fetch, identically to plan: it is a
#     shared `StdCommand` option (cli.py:89-98), flows to
#     `JsonnetConfig(local_only=...)` (config.py:117), and `init_template` skips
#     `_init_base_template` when `local_only` is set (jsonnet.py:~92) — the same
#     `_init_base_template` gate `plan --local` and `validate --local` use. So
#     apply evaluates the EXACT committed `otterdog/vig-os/vendor/` tree that L0
#     validate and L2 plan check; credentials and the live diff are unaffected.
#   - `--delete-resources` is deliberately OMITTED: resources absent from the
#     config are NOT deleted (apply.py:142-144 skips REMOVE patches without the
#     flag). Destructive deletions stay a manual, explicitly-flagged operation.
#
# Exit-code contract (apply.py + diff_operation.py + cli.py `_execute_operation`):
#   - 0  = success: all live patches applied, or nothing to apply. This is the
#          ONLY green outcome.
#   - N>0 = N live-patch applications failed; each `patch.apply` RuntimeError is
#          caught and counted (apply.py:146-153), the apply is PARTIAL, and
#          `handle_finish` returns the error count -> the job must go red.
#   - 1  = invalid credentials / config load failure / RuntimeError abort
#          (diff_operation.py:118-126, 155-165).
#   - 2  = uncaught exception, e.g. config-load failure in `StdCommand.invoke`
#          or the EOF-on-prompt path if `--force` were ever dropped
#          (cli.py:113-115, `_execute_operation` except).
# Unlike plan (where a nonzero exit is benign-config signal rendered as report
# content), an apply error IS a failed mutation: it reddens the job. The job
# summary still records otterdog's own apply output so a reviewer can see
# exactly what was and was not applied.

# REUSABLE INTERFACE (issue #24, ADR-0006): this workflow ALSO exposes
# `workflow_call` so a downstream org's private `org-config` repo (from the
# `template/` skeleton) can call it pinned to an exact tag/SHA. Inputs default to
# `vig-os`/`org-config` and the App/age credentials fall through to this repo's
# own bootstrap secrets on a non-`workflow_call` event, so this repo's own `push`
# to `main` keeps byte-identical semantics. NOTE (ADR-0006 sequencing): a Free
# downstream org onboards read-only (plan+drift) and only wires this apply caller
# AFTER upgrading to Team — apply is the write path.
name: Apply

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      # Applied state is trunk `main` (#63). `dev` is retained only so the
      # trunk-migration PR (#63) itself still fires this last dev-based apply
      # (which flips the production branch policy to `main`); inert once `dev` is
      # deleted.
      - main
      - dev
    paths:
      - otterdog.json
      - otterdog/**
      - secrets/**
      - .sops.yaml
  workflow_dispatch:
  workflow_call:
    inputs:
      org_github_id:
        description: >-
          GitHub login of the org to apply — the `otterdog apply` positional arg
          and the App-token `owner`. Defaults to `vig-os`.
        type: string
        default: vig-os
      config_repo:
        description: >-
          Name of the org's config repo. Defaults to `org-config`.
        type: string
        default: org-config
      otterdog_version:
        description: >-
          Otterdog version to run. Downstream callers MUST pass their own pin
          (kept in the caller workflow beside the engine SHA pin, issue #56);
          when empty — this repo's own events — the pin is read from
          `justfile.project` (ADR-0005 SSoT).
        type: string
        default: ''
    # Secret names MATCH this repo's bootstrap Actions secrets (github-app.md /
    # ADR-0003), so the credential references below are byte-identical whether
    # reached on this repo's own push (repo secrets) or via `workflow_call`
    # (caller-passed). A downstream caller passes its identically-named secrets.
    secrets:
      ORG_CONFIG_APP_CLIENT_ID:
        description: Client ID of the org-management GitHub App (ADR-0004).
        required: true
      ORG_CONFIG_APP_PRIVATE_KEY:
        description: PEM private key of the org-management GitHub App (ADR-0004).
        required: true
      SOPS_AGE_KEY:
        description: >-
          age private identity that decrypts the committed `secrets/*.yaml`
          ciphertext (ADR-0003). Only needed when the config declares secrets;
          the decrypt step is skipped when no `secrets/*.yaml` exist.
        required: false

# Static, cross-workflow concurrency group so all mutations serialize (never
# cancel mid-apply). Caller-scoped: the org suffix is EMPTY on this repo's own
# events, so the group stays literally `otterdog-mutate` here — byte-identical,
# and drift.yml + testbed-e2e.yml keep sharing it. A downstream caller passes its
# org, yielding `otterdog-mutate-<org>`, so its mutations never serialize against
# vig-os's.
concurrency:
  group: otterdog-mutate${{ inputs.org_github_id && format('-{0}', inputs.org_github_id) || '' }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Pre-approval plan preview (#105): read-only plan of the EXACT tree this run
  # would apply, written into this run's job summary so the deployment approver
  # sees the pending mutation one click from the approve button. Reuses
  # plan.yml via a local `workflow_call` (single source of the plan harness);
  # ungated (no environment) because the read path carries the same trust level
  # as plan.yml on PRs and drift.yml on schedule. THIS REPO'S OWN EVENTS ONLY:
  # the empty-inputs test below distinguishes an own push/dispatch (inputs
  # context empty) from a downstream `workflow_call` (inputs default to
  # 'vig-os'), so downstream callers are unaffected and nested `./` workflow
  # resolution is never relied on (#56) — a downstream org wires its own
  # preview beside its apply caller if it wants one. Deliberately NOT a `needs:`
  # of `apply`: a preview harness failure must never block a legitimate apply,
  # and the apply pauses on human approval regardless.
  preview:
    name: Preview plan for approval
    if: inputs.org_github_id == ''
    permissions:
      contents: read          # checkout of the committed config for the plan
      # Declared by plan.yml's job and therefore required here by the caller
      # permission cap; inert on push — the comment step is PR-event-gated.
      pull-requests: write
    uses: ./.github/workflows/plan.yml
    secrets:
      ORG_CONFIG_APP_CLIENT_ID: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
      ORG_CONFIG_APP_PRIVATE_KEY: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}

  apply:
    name: Apply committed config to live ${{ inputs.org_github_id || 'vig-os' }}
    # ADR-0007 BINDING: apply runs only from the config repo's own trunk; a fork
    # cannot push to the base repo, so this is trivially true and here to be
    # explicit. Generalized from the `vig-os/org-config` literal to the
    # caller's own `<org>/<config_repo>` (defaults resolve to `vig-os/org-config`
    # on this repo's own push — same truth value), so a downstream caller asserts
    # its OWN repo identity, not vig-os's.
    if: github.repository == format('{0}/{1}', inputs.org_github_id || 'vig-os', inputs.config_repo || 'org-config')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The production environment (required reviewer c-vigo, main-only deployment
    # branch policy) is the human approval gate on mutations — the run pauses
    # here until the deployment is approved.
    environment: production
    permissions:
      contents: read          # read the committed otterdog config
    steps:
      # SUPERSESSION GUARD (#105) — must be the FIRST step, because it runs
      # AFTER the environment approval and that is the only moment the check is
      # meaningful: any merge that lands while the run waits for approval makes
      # this tree stale. Compares the run's commit against the LIVE tip of the
      # applied branch via the API (never the checkout, which is pinned to the
      # stale sha by definition). On supersession every subsequent step skips
      # (the report/fail steps already self-skip when the apply step is
      # skipped), the job stays green, and the summary + notice explain that
      # the newer queued apply carries the delta. GITHUB_TOKEN with
      # `contents: read` is sufficient, including for a private downstream
      # caller repo.
      - name: Skip if superseded (newer commit on the applied branch)
        id: supersession
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/${REPO}/commits/${REF_NAME}" --jq .sha)"
          if [ "${tip}" = "${RUN_SHA}" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
            echo "tree ${RUN_SHA} is the tip of ${REF_NAME} — proceeding with apply"
          else
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "::notice::apply skipped: ${RUN_SHA} is no longer the tip of ${REF_NAME} (now ${tip}); the newer queued apply carries this delta (#105)."
            {
              echo "## Apply skipped — superseded tree (#105)"
              echo
              echo "This run's tree \`${RUN_SHA}\` is no longer the tip of \`${REF_NAME}\` (now \`${tip}\`)."
              echo "Applying it would mutate live state toward a config that is no longer on trunk,"
              echo "so the apply was skipped entirely; the queued apply for the newer commit carries"
              echo "this delta. Nothing was applied. To re-apply the current state, dispatch a fresh run."
              echo
              echo "[Run log](${RUN_URL})"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Checkout repository
        if: steps.supersession.outputs.superseded != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        if: steps.supersession.outputs.superseded != 'true'
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990  # v8.3.2

      # Otterdog version pin: on this repo's own events, justfile.project
      # (`otterdog_version`) is the single source of truth (ADR-0005). Downstream
      # callers check out THEIR repo (no justfile.project — template/ ships none,
      # issue #56), so they pass the pin as the `otterdog_version` input instead.
      - name: Resolve otterdog version pin
        if: steps.supersession.outputs.superseded != 'true'
        env:
          OTTERDOG_VERSION_INPUT: ${{ inputs.otterdog_version || '' }}
        run: |
          set -euo pipefail
          if [ -n "${OTTERDOG_VERSION_INPUT}" ]; then
            version="${OTTERDOG_VERSION_INPUT}"
          elif [ -f justfile.project ]; then
            version="$(grep -oP 'otterdog_version\s*:=\s*"\K[^"]+' justfile.project)"
          else
            echo "::error::no otterdog_version input and no justfile.project in the checkout (downstream callers must pass the input — issue #56)"
            exit 1
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not resolve otterdog_version from justfile.project"
            exit 1
          fi
          echo "OTTERDOG_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved otterdog version: ${version}"

      # --- Secrets-as-code bridge (issue #22, ADR-0003) --------------------
      # Install a pinned, checksum-verified sops so the committed age ciphertext
      # can be decrypted at apply time. sops has age built in and reads the
      # private identity from `SOPS_AGE_KEY` (a bootstrap env secret), so no
      # separate `age` binary or key file is needed.
      - name: Install sops (pinned, checksum-verified)
        if: steps.supersession.outputs.superseded != 'true'
        env:
          SOPS_VERSION: v3.13.1
          SOPS_SHA256: 620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a
        run: |
          set -euo pipefail
          url="https://github.com/getsops/sops/releases/download/${SOPS_VERSION}/sops-${SOPS_VERSION}.linux.amd64"
          curl -fsSL --retry 3 "${url}" -o /tmp/sops
          echo "${SOPS_SHA256}  /tmp/sops" | sha256sum -c -
          sudo install -m 0755 /tmp/sops /usr/local/bin/sops
          sops --version

      # Decrypt committed ciphertext in-memory and load each value into a
      # throwaway `pass` store keyed `org-config/<NAME>`, which otterdog resolves
      # for any secret whose jsonnet `value` is `pass:org-config/<NAME>`. The GPG
      # key is generated here, passphrase-less, and never leaves the runner: it
      # is transport for `pass`, not a managed/bootstrap key. Runs only when
      # ciphertext is present; a no-op otherwise. NO `set -x` — values are piped,
      # never printed, and masked defensively.
      - name: Decrypt SOPS secrets into apply-time pass store
        if: steps.supersession.outputs.superseded != 'true' && hashFiles('secrets/*.yaml') != ''
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq pass >/dev/null

          # Isolated, ephemeral homes under the runner temp dir; handed to the
          # apply step via GITHUB_ENV so otterdog's `pass:` resolution finds them.
          # Discarded with the runner; never persisted, never committed.
          GNUPGHOME="${RUNNER_TEMP}/otterdog-apply-gnupg"
          PASSWORD_STORE_DIR="${RUNNER_TEMP}/otterdog-apply-pass"
          export GNUPGHOME PASSWORD_STORE_DIR

          # Ephemeral, passphrase-less GPG identity — regenerated every run.
          mkdir -p "${GNUPGHOME}"; chmod 700 "${GNUPGHOME}"
          cat > "${GNUPGHOME}/keyparams" <<'KEYPARAMS'
          %no-protection
          Key-Type: RSA
          Key-Length: 3072
          Subkey-Type: RSA
          Subkey-Length: 3072
          Name-Real: org-config apply bridge
          Name-Email: apply-bridge@vig-os.invalid
          Expire-Date: 0
          %commit
          KEYPARAMS
          gpg --batch --quiet --gen-key "${GNUPGHOME}/keyparams"
          rm -f "${GNUPGHOME}/keyparams"
          fpr="$(gpg --list-secret-keys --with-colons | awk -F: '/^fpr:/{print $10; exit}')"
          mkdir -p "${PASSWORD_STORE_DIR}"
          pass init "${fpr}" >/dev/null

          # For each secrets/*.yaml, insert every top-level key as
          # pass `org-config/<KEY>`. Keys come from a JSON projection; each value
          # is extracted individually (handles any value shape), masked, and
          # piped straight into pass — never echoed.
          count=0
          shopt -s nullglob
          for f in secrets/*.yaml; do
            while IFS= read -r name; do
              [ -n "${name}" ] || continue
              value="$(sops -d --extract "[\"${name}\"]" "${f}")"
              echo "::add-mask::${value}"
              printf '%s' "${value}" | pass insert -m -f "org-config/${name}" >/dev/null
              count=$((count + 1))
            done < <(sops -d --output-type json "${f}" | jq -r 'keys[]')
          done
          echo "pass bridge populated with ${count} secret(s) from committed ciphertext"

          # Hand the store/keyring locations to the apply step (and beyond).
          {
            echo "GNUPGHOME=${GNUPGHOME}"
            echo "PASSWORD_STORE_DIR=${PASSWORD_STORE_DIR}"
          } >> "${GITHUB_ENV}"

      # FULL installation token — NO permission-* narrowing (ADR-0004
      # Corrections): the App grant is the boundary; a narrowed token cannot read
      # Actions Variables. `owner: vig-os` makes it org-wide because apply must
      # write across every managed repo. zizmor's github-app finding on the broad
      # token is an acknowledged, deliberate decision recorded INLINE (never in
      # zizmor.yml, which would silently exempt future edits of this file).
      - name: Mint full App installation token (unnarrowed, org-wide)
        id: app-token
        if: steps.supersession.outputs.superseded != 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org_github_id || 'vig-os' }}  # zizmor: ignore[github-app]

      - name: Run otterdog apply (mutating, committed config)
        id: apply
        if: steps.supersession.outputs.superseded != 'true'
        env:
          # The `env` credential provider reads the token from this variable.
          OTTERDOG_TOKEN: ${{ steps.app-token.outputs.token }}
          # Org selector, via env (never inline `${{ }}` in `run:`) to keep the
          # zizmor template-injection surface closed. Empty inputs -> vig-os.
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
          # Dummy web credentials. `apply --no-web-ui` resolves credentials with
          # only_token=True (diff_operation.py:132), so these are not exercised;
          # they are supplied to satisfy the env provider's declared keys
          # robustly and are provably never used on the --no-web-ui path.
          OTTERDOG_DUMMY_USERNAME: apply-dummy-unused
          OTTERDOG_DUMMY_PASSWORD: apply-dummy-unused
          OTTERDOG_DUMMY_TWOFA_SEED: apply-dummy-unused
          # Deterministic, unwrapped rich output for a clean code block.
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          # No errexit around otterdog: its exit code is captured and reported,
          # then reflected as job status in a later step so the apply output
          # always reaches the summary first.
          set -uo pipefail
          OTTER=(uvx --with python-dotenv==1.1.0 --from "otterdog@${OTTERDOG_VERSION}" otterdog)
          set +e
          "${OTTER[@]}" apply --local --no-web-ui --force -c otterdog.json "${ORG_GITHUB_ID}" >apply.txt 2>&1
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "otterdog apply exited ${rc}"
          cat apply.txt

      - name: Build apply report (job summary)
        if: always() && steps.apply.outcome != 'skipped'
        env:
          APPLY_RC: ${{ steps.apply.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          [ -f apply.txt ] || echo "(no apply output was produced — the apply step did not run to completion)" > apply.txt

          if [ "${APPLY_RC:-1}" = "0" ]; then
            status="Apply completed cleanly (exit 0): all changes were applied to live \`vig-os\`, or there was nothing to apply."
          else
            status="Apply exited with code \`${APPLY_RC}\`. \`apply\` is nonzero only on a failed or partial mutation (or invalid config/auth/harness) — the apply did **not** fully succeed. See the run log; the job is failed."
          fi

          # --- Job summary (generous 1 MiB budget; truncate very large output) ---
          MAX_APPLY_BYTES=900000
          if [ "$(wc -c < apply.txt)" -gt "${MAX_APPLY_BYTES}" ]; then
            head -c "${MAX_APPLY_BYTES}" apply.txt > apply.summary.txt
            printf '\n... [output truncated for the summary — see the full log in the run] ...\n' >> apply.summary.txt
          else
            cp apply.txt apply.summary.txt
          fi

          {
            echo "## Otterdog apply — \`vig-os\` (mutating)"
            echo
            echo "_\`apply --local --no-web-ui --force\` against the committed config — the exact tree L0 \`otterdog validate --local\` checks and L2 \`plan\` previewed. Changes were written to live \`vig-os\`._"
            echo
            echo "${status}"
            echo
            echo '```text'
            cat apply.summary.txt
            echo '```'
            echo
            echo "[Run log](${RUN_URL}) · triggered by \`${EVENT_NAME}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Reflect otterdog's exit code as the job status AFTER the summary is
      # written, so a failed/partial mutation reddens the check while the summary
      # still shows exactly what was applied. A nonzero apply IS a failed
      # mutation (not benign drift), so it fails the job.
      - name: Fail on apply error
        if: always() && steps.apply.outcome != 'skipped'
        env:
          APPLY_RC: ${{ steps.apply.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "${APPLY_RC:-1}" != "0" ]; then
            echo "::error::otterdog apply failed (exit ${APPLY_RC}); the mutation was partial or aborted — check the config, auth, or harness and re-run."
            exit 1
          fi
          echo "otterdog apply succeeded (exit 0); the committed config is live on vig-os."
