# Plan-on-PR — read-only `otterdog plan` of the committed config against live
# `vig-os`, posted back to the PR (issue #18, ADR-0007 L2 "free E2E read path").
#
# This is a repo-OWNED workflow (not devkit-managed), so zizmor gates it in full:
# it is deliberately absent from zizmor.yml, and the only accepted findings are
# the two scoped, justified `github-app` inline ignores below. Everything else
# must be fixed here, not baselined.
#
# Security model (ADR-0007 §Public-repo credential rules, BINDING):
#   - Runs ONLY on same-repo PRs (`head.repo.full_name == github.repository`) or
#     manual dispatch; fork PRs get L0 static checks only, never a plan — this is
#     the standard Poisoned-Pipeline-Execution guard (OWASP CICD-SEC-4). Fork PRs
#     also cannot see the App secrets, so this `if:` is belt-and-braces.
#   - No `pull_request_target`; the default `pull_request` checkout is read-only.
#   - Least-privilege `permissions:`: `contents: read` to read the config,
#     `pull-requests: write` only to post the plan comment (via GITHUB_TOKEN, not
#     the App token). `plan` is non-mutating, so this workflow never applies.
#
# Auth (ADR-0004 Corrections, spike #16): the otterdog read surface needs the
# FULL App installation token — a narrowed token cannot carry Actions Variables
# (GitHub's token-narrowing schema has no key for them), and otterdog's
# org-variables read is fatal on 403. The App grant is the permission boundary;
# read-only-ness is enforced by BEHAVIOR (`plan` only issues GETs; `apply` is a
# separate, environment-gated workflow — #19), not by a `permission-*` block.
#
# Template re-fetch trap (SOLVED with `--local`): a non-local `plan` runs
# `JsonnetConfig.init_template`, which calls `_init_base_template`
# (otterdog 1.3.4 jsonnet.py:98-99) — that `rmtree`s `otterdog/vig-os/vendor`
# (jsonnet.py:378) and re-clones the upstream EclipseFdn defaults over it,
# re-introducing the Eclipse `.py` policy hooks that #17 deliberately drops from
# the vendored tree. `--local` sets `local_only=True`
# (cli.py:89-98 -> config.py:117 -> jsonnet.py:68), which skips
# `_init_base_template` entirely (jsonnet.py:98) and evaluates the COMMITTED
# vendor as-is. This is the exact same mode `just validate` uses
# (`otterdog validate --local`), so plan and L0 validate agree on one config.
# `--local` only gates the vendor re-fetch; credentials and the live-GitHub diff
# are unaffected (it is the sole use of `local_only` in the codebase).
# Failure mode: if `otterdog.json`'s `base_template` ref is bumped but the
# committed vendor is not refreshed to match, plan (like validate) uses the
# stale committed vendor — which is the intended, reviewed source of truth for a
# vendored-defaults repo, so the two stay consistent.

# REUSABLE INTERFACE (issue #24, ADR-0006): this workflow ALSO exposes
# `workflow_call` so downstream orgs' private `org-config` repos (created from the
# `template/` skeleton) can call it, pinned to an exact tag/SHA of THIS public
# repo. The inputs default to `vig-os`/`org-config`, so this repo's own
# `pull_request`/`workflow_dispatch` triggers keep their exact prior semantics:
# on a non-`workflow_call` event the `inputs` context is empty, so every
# `inputs.X || '<default>'` resolves to the vig-os default, and every
# `secrets.<alias> || secrets.<REPO_SECRET>` resolves to this repo's own
# bootstrap secret (the caller-passed alias is empty). Callers pass the App
# credentials as `secrets:` (callable cross-org because this repo is public).
#
# DOWNSTREAM MERGE GATE — FAIL-SOFT IS BINDING (#268): a caller may make this
# job's check a REQUIRED status context on its own `main`, and a caller that
# does ships no `paths:` filter (a filtered skip leaves a required context
# Pending forever, so the two are one decision). Assume a caller has: every
# step below then sits on another org's merge gate, for every pull request,
# including ones that touch no config. Two classes of step, and only the first
# may redden:
#   * THE VERDICT SPINE — checkout, uv, `Resolve otterdog version pin`, the
#     token mint, `Run otterdog plan`, `Fail on plan error`. These redden BY
#     DESIGN, and that is exactly the contract a consumer states for the check:
#     it reddens on invalid config, auth, or a harness error, never on a diff.
#   * EVERYTHING AUXILIARY — anything not needed to produce that verdict. It
#     MUST be fail-soft: a guard, `continue-on-error`, and an `if:` on the
#     guard's output, so it degrades to "not checked" instead of reddening
#     someone else's gate. The App-slug steps below are the worked example
#     (#259 / #274).
# Two shipped auxiliary steps do NOT meet that rule yet — `Build plan report`
# and `Upsert plan comment on the PR`, both `if: always()` with
# `set -euo pipefail` and `gh api` writes, so a 422/5xx on a cosmetic comment
# reddens the gate. Tracked in #276; they are the known exceptions, not
# precedent. ADR-0007's Axis D "advisory" verdict (#236) is about THIS repo
# only — its 2026-09-25 correction carries the downstream evidence.
name: Plan

on:  # yamllint disable-line rule:truthy
  pull_request:
    # Trunk model (#63): PRs target `main`, the single applied-state branch.
    branches:
      - main
    paths:
      - otterdog.json
      - otterdog/**
      - .github/workflows/plan.yml
      # `justfile.project` is here for one reason (#230): it holds
      # `otterdog_version`, the ADR-0005 single source of truth that the "Resolve
      # otterdog version pin" step below greps at run time. It therefore selects
      # the BINARY that produces the diff — the highest-leverage input to plan
      # behaviour in the repo, and ADR-0007's whole argument for pinning is that
      # a version change can move that behaviour. A pure pin bump touches no
      # config path, so without this line it gets no plan run at all: #229
      # (1.4.0 -> 1.5.0) had to produce its empty-plan evidence by hand
      # (`workflow_dispatch`, run 35844030809), while #145 (1.3.4 -> 1.4.0) was
      # covered only incidentally because it also edited `otterdog/vig-os/`.
      # Relying on that coincidence is luck, not coverage. Yes, the file also
      # carries unrelated recipes, so some plan runs will diff nothing — it has
      # moved 8 times in this repo's life (no Renovate manager matches it, and
      # devkit upgrades preserve it), so the cost is a handful of read-only runs
      # against a pin bump silently losing its evidence.
      - justfile.project
      # The same argument, for the same reason, for the in-house drift layer
      # (#259): the App-slug check below runs `drift-layer --app-actors-report`,
      # so this repo's own `src/` now selects part of what the plan report says.
      # Without these lines a change to the mode's classification, flags or
      # report shape gets no plan run at all and ships with zero end-to-end
      # signal — the #230 lesson ("relying on that coincidence is luck, not
      # coverage") applied to the engine rather than the pin. `pyproject.toml`
      # rides along because it declares the console script the step invokes.
      - src/drift_layer/**
      - pyproject.toml
      # Governance state the check READS: an `[[app_actor]]` entry suppresses a
      # known-unresolvable slug, so editing this file changes the plan report.
      - drift-allowlist.toml
  workflow_dispatch:
  workflow_call:
    inputs:
      org_github_id:
        description: >-
          GitHub login of the org to plan — the `otterdog plan` positional arg
          (selects the org from otterdog.json) and the App-token `owner`.
          Defaults to `vig-os` so this repo's own triggers are unchanged.
        type: string
        default: vig-os
      config_repo:
        description: >-
          Name of the org's config repo. Defaults to `org-config`.
        type: string
        default: org-config
      otterdog_version:
        description: >-
          Otterdog version to run. Defaults to the engine's OWN pin (#228), so a
          caller inherits the otterdog version together with the engine ref it
          already pins, and needs no literal of its own — nothing propagated the
          old hand-mirrored one (issue #56 assumed Renovate would; it never
          matched a bare `with:` string). This literal duplicates
          `justfile.project`'s `otterdog_version`, the ADR-0005 SSoT, and
          `tests/test_otterdog_pin.py` fails if the two ever diverge. Pass a
          value to override; pass an explicitly EMPTY string to resolve the pin
          from a `justfile.project` in the checkout instead.
        type: string
        # renovate: datasource=pypi depName=otterdog
        default: '1.5.0'
    # Secret names MATCH this repo's bootstrap Actions secrets (github-app.md), so
    # the credential references below are byte-identical whether reached on this
    # repo's own events (repo secrets) or via `workflow_call` (caller-passed). A
    # downstream caller passes its own identically-named secrets (or `inherit`).
    secrets:
      ORG_CONFIG_APP_CLIENT_ID:
        description: Client ID of the org-management GitHub App (ADR-0004).
        required: true
      ORG_CONFIG_APP_PRIVATE_KEY:
        description: PEM private key of the org-management GitHub App (ADR-0004).
        required: true

# Per-PR concurrency; plan is read-only, so cancelling a superseded run is safe.
# Caller-scoped: the org suffix (empty on this repo's own events, byte-identical
# to the prior `${{ github.workflow }}-<pr>` group) keeps a downstream caller's
# plans from serializing against vig-os's.
concurrency:
  group: ${{ github.workflow }}${{ inputs.org_github_id && format('-{0}', inputs.org_github_id) || '' }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  plan:
    name: Plan committed config against live ${{ inputs.org_github_id || 'vig-os' }}
    # ADR-0007 BINDING: never expose org-admin credentials to fork PRs. `push`
    # is admitted because it is fork-safe by construction (a fork cannot push
    # to the base repo) — it is how apply-engine.yml's pre-approval `preview`
    # job reaches this workflow via `workflow_call` on a trunk push (#105).
    if: >-
      github.event_name == 'workflow_dispatch'
      || github.event_name == 'push'
      || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read          # read the committed otterdog config
      pull-requests: write     # post / update the plan comment (GITHUB_TOKEN)
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4  # v10.1.0

      # Otterdog version pin. The `workflow_call` default supplies it to every
      # caller since #228 — a downstream checks out THEIR repo, which has no
      # `justfile.project` (template/ ships none, issue #56), so the input is the
      # only thing it can resolve from. The `elif` is the ADR-0005 SSoT path: it
      # serves this repo's own events, where `inputs` is empty, and
      # `apply-engine.yml`, which passes an explicit `otterdog_version: ''` to
      # keep `justfile.project` the resolver for the engine's own runs.
      - name: Resolve otterdog version pin
        env:
          OTTERDOG_VERSION_INPUT: ${{ inputs.otterdog_version || '' }}
        run: |
          set -euo pipefail
          if [ -n "${OTTERDOG_VERSION_INPUT}" ]; then
            version="${OTTERDOG_VERSION_INPUT}"
          elif [ -f justfile.project ]; then
            version="$(grep -oP 'otterdog_version\s*:=\s*"\K[^"]+' justfile.project)"
          else
            echo "::error::no otterdog_version input and no justfile.project in the checkout — unreachable unless a caller passed an explicitly empty otterdog_version (#228)"
            exit 1
          fi
          if [ -z "${version}" ]; then
            echo "::error::could not resolve otterdog_version from justfile.project"
            exit 1
          fi
          echo "OTTERDOG_VERSION=${version}" >> "$GITHUB_ENV"
          echo "Resolved otterdog version: ${version}"

      # FULL installation token — NO permission-* narrowing (ADR-0004
      # Corrections): the App grant is the boundary; a narrowed token cannot read
      # Actions Variables. `owner: vig-os` makes it org-wide because plan must see
      # every repo. zizmor's github-app finding on the broad token is an
      # acknowledged, deliberate decision recorded INLINE (never in zizmor.yml,
      # which would silently exempt future edits of this file).
      - name: Mint full App installation token (unnarrowed, org-wide)
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3 # zizmor: ignore[github-app]
        with:
          client-id: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
          private-key: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
          owner: ${{ inputs.org_github_id || 'vig-os' }}  # zizmor: ignore[github-app]

      - name: Run otterdog plan (read-only, committed config)
        id: plan
        env:
          # The `env` credential provider reads the token from this variable.
          OTTERDOG_TOKEN: ${{ steps.app-token.outputs.token }}
          # Org selector, via env (never inline `${{ }}` in `run:`) to keep the
          # zizmor template-injection surface closed. Empty inputs -> vig-os.
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
          # Dummy web credentials. `plan --no-web-ui` resolves credentials with
          # only_token=True (diff_operation.py:132), so these are not exercised;
          # they are supplied to satisfy the env provider's declared keys
          # robustly and are provably never used on the --no-web-ui path.
          OTTERDOG_DUMMY_USERNAME: plan-dummy-unused
          OTTERDOG_DUMMY_PASSWORD: plan-dummy-unused
          OTTERDOG_DUMMY_TWOFA_SEED: plan-dummy-unused
          # Deterministic, unwrapped rich output for a clean code block.
          NO_COLOR: "1"
          COLUMNS: "200"
        run: |
          # No errexit: otterdog's exit code is the SIGNAL we report on, not a
          # reason to abort the harness. `plan` returns validation_status.errors
          # (plan.py handle_finish), so a non-empty DIFF exits 0 — only invalid
          # config / auth / harness failures are nonzero.
          set -uo pipefail
          OTTER=(uvx --with python-dotenv==1.1.0 --from "otterdog@${OTTERDOG_VERSION}" otterdog)
          set +e
          "${OTTER[@]}" plan --local --no-web-ui -c otterdog.json "${ORG_GITHUB_ID}" >plan.txt 2>&1
          rc=$?
          set -e
          echo "rc=${rc}" >> "$GITHUB_OUTPUT"
          echo "otterdog plan exited ${rc}"
          cat plan.txt

      # ENGINE CHECKOUT (downstream callers only, issue #169 — the same pattern
      # drift.yml uses, for the same reason): the App-slug check below runs the
      # in-house drift layer (`src/drift_layer/`), which lives in THIS engine
      # repo; a downstream caller's config-data checkout has no `src/`,
      # `pyproject.toml` or `uv.lock`. `job.workflow_sha` is the exact SHA the
      # caller pins in `uses:`, so engine code and workflow can never skew and
      # the caller's Renovate bump moves both atomically. Guard first: an empty
      # SHA would silently check out the engine's default branch. Placed AFTER
      # the plan leg so otterdog provably ran on an untouched caller tree; on
      # this repo's own runs both steps are skipped, because the primary
      # checkout already IS the engine tree.
      #
      # ONE DELIBERATE DIVERGENCE from drift.yml's guard: there an empty SHA is
      # a hard `exit 1`, because the drift layer IS that job. Here it is a
      # WARNING that skips the check, because the App-slug finding is advisory
      # and `plan` is every downstream org's review gate — reddening it over a
      # missing context property would cost more than the check is worth. The
      # unpinned checkout is still refused either way, which is what #169 is
      # about; the fragment below says the check did not run.
      - name: Guard engine pin (downstream callers)
        id: engine-pin
        if: always() && github.repository != 'vig-os/org-config' && steps.plan.outcome != 'skipped'
        # FAIL-SOFT, BINDING (#268): downstream this job's context is a REQUIRED
        # check on `main` (`exo-pet/org-config`'s Main protection requires
        # exactly `plan / Plan committed config against live <org>`, and its
        # caller ships no `paths:` filter for that reason), so every step added
        # here sits on another org's merge gate for every pull request,
        # including ones that touch no config. An advisory read must not be able
        # to convert a transient GitHub blip into "no PR can merge" — hence
        # `continue-on-error` on all three new steps, each of which also has an
        # `if:` on the guard's output so a failure degrades to "not checked"
        # rather than to a half-run check.
        continue-on-error: true
        env:
          JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          if [ -z "${JOB_WORKFLOW_SHA}" ]; then
            echo "::warning::job.workflow_sha is empty on a downstream run; skipping the App-slug check rather than checking out an unpinned engine tree (issue #169)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            {
              echo '### Declared App slugs'
              echo
              echo '**The declared App slugs could not be checked** on this run: the engine checkout is unpinned (the job workflow SHA is empty), and an unpinned engine tree is refused. This is a harness gap, not a verdict — treat the slugs as unverified.'
            } > app-actors.md
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "Engine checkout pinned to ${JOB_WORKFLOW_SHA}"

      - name: Checkout engine repository (downstream callers)
        if: always() && github.repository != 'vig-os/org-config' && steps.engine-pin.outputs.ok == 'true'
        # Fail-soft for the reason above (#268): a checkout of another
        # repository is a network operation on a downstream merge gate. If it
        # fails, `.drift-engine` is absent, the check step's `uv run --project`
        # fails, and that step writes its own "could not be checked" fragment —
        # the plan itself already ran and is unaffected.
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: vig-os/org-config
          ref: ${{ job.workflow_sha }}
          path: .drift-engine
          persist-credentials: false

      # Ask this job's own credential the two questions otterdog will ask, and
      # the plan above cannot (issue #259). They are INDEPENDENT:
      #   1. `GET /apps/{slug}` — the WRITE-path resolution. otterdog never
      #      calls it on read (it maps a live `actor_id` back to a slug from
      #      `/orgs/{org}/installations`), so a declared App slug this
      #      installation token cannot read renders perfectly in the plan above
      #      and fails the mutating apply (#256). Three of the four write-path
      #      sites abort the patch; the fourth, environment reviewers, drops the
      #      actor silently and leaves a protection that was never written.
      #   2. Membership of `/orgs/{org}/installations` — the READ-path
      #      resolution, for the two sites that need it. A declared App the org
      #      has no installation for is dropped outright as a bypass actor or
      #      read back numeric as a status check, so plan proposes the same
      #      change forever and apply never converges (#262's detection half).
      # Both read the DECLARED config only; an actor that exists live but is
      # declared nowhere needs a live ruleset read and is not covered.
      #
      # ADVISORY, BINDING (ADR-0007 Axis D, #236): `Plan` is not a required
      # check in THIS repository, and downstream this job's own context is a
      # required one (#268), so in both directions these findings live in the
      # report body and the job summary and NEVER in an exit code. This step
      # cannot fail and does not touch `steps.plan.outputs.rc`, so `Fail on
      # plan error` keeps its contract ("nonzero means config/auth/harness,
      # never drift").
      - name: Check declared App slugs against this job's token
        id: app-actors
        # Belt and braces with the `exit 0`s below (#268): the mode itself
        # catches every exception and exits 0, and every shell branch here ends
        # in `exit 0`, but a failure of the runner shell itself must not redden
        # a downstream merge gate either.
        continue-on-error: true
        if: >-
          always() && steps.plan.outcome != 'skipped'
          && (github.repository == 'vig-os/org-config'
              || steps.engine-pin.outputs.ok == 'true')
        env:
          # The one credentialed part of the check. Extraction is token-free.
          # `DRIFT_REPOS_TOKEN`, not `GITHUB_TOKEN`: this repo reserves the
          # latter name for the issues:write-NARROWED token (`drift.yml:348-349`,
          # `cli.py`'s module docstring), and it is also the name every `gh`
          # invocation picks up by default — handing an org-admin installation
          # token over under it is a footgun for whoever next adds a `gh` call
          # to this step.
          DRIFT_REPOS_TOKEN: ${{ steps.app-token.outputs.token }}
          # Org selector, via env (never inline `${{ }}` in `run:`).
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
          # Where the drift-layer PROJECT lives (#169): the engine sub-checkout
          # on downstream runs, this very checkout on the engine's own.
          DRIFT_PROJECT_DIR: ${{ github.repository != 'vig-os/org-config' && '.drift-engine' || '.' }}
        run: |
          # Deliberately no errexit: an advisory warning must never redden a
          # read-only review gate. Each failure path writes its own fragment.
          set -uo pipefail
          ORG_FILE="otterdog/${ORG_GITHUB_ID}/${ORG_GITHUB_ID}.jsonnet"
          # Token-free evaluation, through otterdog's OWN evaluator: this is the
          # exact call `GitHubOrganization.load_from_file` makes
          # (models/github_organization.py:536), so the document checked here is
          # the document apply would write from — no second jsonnet toolchain,
          # no extra pin, and provably identical to `jsonnet` on this config.
          EVAL='import json,sys;from otterdog.utils import jsonnet_evaluate_file;json.dump(jsonnet_evaluate_file(sys.argv[1]),sys.stdout)'
          if ! uvx --from "otterdog@${OTTERDOG_VERSION}" python -c "${EVAL}" "${ORG_FILE}" > org-evaluated.json; then
            {
              echo '### Declared App slugs'
              echo
              echo "**The declared App slugs could not be checked** on this run: \`${ORG_FILE}\` could not be evaluated. This is a harness gap, not a verdict — treat the slugs as unverified."
            } > app-actors.md
            cat app-actors.md
            exit 0
          fi
          # `drift-allowlist.toml` is read from the CONFIG repo's root — this
          # checkout, never the engine sub-checkout — so a downstream org
          # documents its own known-unresolvable slugs (#259). A missing file is
          # an empty allow-list, so a caller that has none is unaffected.
          if ! uv run --project "${DRIFT_PROJECT_DIR}" drift-layer \
              --app-actors-report \
              --org "${ORG_GITHUB_ID}" \
              --config-json org-evaluated.json \
              --allowlist drift-allowlist.toml \
              --json-out app-actors.json > app-actors.md; then
            {
              echo '### Declared App slugs'
              echo
              echo '**The declared App slugs could not be checked** on this run: the drift-layer check did not complete. This is a harness gap, not a verdict — treat the slugs as unverified.'
            } > app-actors.md
          fi
          cat app-actors.md
          exit 0

      - name: Build plan report (comment body + job summary)
        if: always() && steps.plan.outcome != 'skipped'
        env:
          PLAN_RC: ${{ steps.plan.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          ORG_GITHUB_ID: ${{ inputs.org_github_id || 'vig-os' }}
        run: |
          set -euo pipefail
          MARKER='<!-- otterdog-plan-report -->'
          [ -f plan.txt ] || echo "(no plan output was produced — the plan step did not run to completion)" > plan.txt
          # The App-slug fragment (#259), folded into BOTH artefacts below
          # rather than posted as a second comment: this step is the one place
          # that assembles the marker-upserted body and the job summary, so a
          # reviewer sees the finding beside the diff it is invisible in. A
          # missing file means that step did not run; the plan report is
          # unchanged in that case.
          [ -f app-actors.md ] || : > app-actors.md

          if [ "${PLAN_RC:-1}" = "0" ]; then
            status="Plan completed. A non-empty diff is drift for the PR author to decide on, **not** a failure."
          else
            status="Plan exited with code \`${PLAN_RC}\`. \`plan\` returns 0 on drift, so a nonzero code means invalid config, auth, or a harness error — not drift. See the run log."
          fi

          # --- Job summary (generous 1 MiB budget: full output) ---
          {
            echo "## Otterdog plan — \`${ORG_GITHUB_ID}\` (read-only)"
            echo
            echo "_\`plan --local --no-web-ui\` against the committed config — the exact tree L0 \`otterdog validate --local\` checks. Nothing is applied._"
            echo
            echo "${status}"
            echo
            echo '```text'
            cat plan.txt
            echo '```'
            echo
            if [ -s app-actors.md ]; then
              cat app-actors.md
              echo
            fi
            echo "[Run log](${RUN_URL})"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- PR comment body (65536-char cap: truncate the plan text safely) ---
          # The budget is shared, and the App-slug fragment is inside it (#259).
          # An over-limit body makes the upsert's `gh api` return 422 under
          # `set -euo pipefail`, failing this job — which downstream is a
          # required check on `main` (#268), i.e. the one failure this whole
          # design forbids. So: cap the fragment first, then give the plan text
          # whatever is left. Measured today the fragment is ~0.7 KB clean and
          # ~1.5 KB with seven failing rows, so the cap is headroom, not a limit
          # anything reaches.
          MAX_BODY_BYTES=55000
          MAX_FRAGMENT_BYTES=8000
          if [ "$(wc -c < app-actors.md)" -gt "${MAX_FRAGMENT_BYTES}" ]; then
            head -c "${MAX_FRAGMENT_BYTES}" app-actors.md > app-actors.comment.md
            printf '\n\n_App-slug fragment truncated for the comment; the full fragment is in the [job summary](%s)._\n' "${RUN_URL}" >> app-actors.comment.md
          else
            cp app-actors.md app-actors.comment.md
          fi
          fragment_bytes="$(wc -c < app-actors.comment.md)"
          MAX_PLAN_BYTES=$(( MAX_BODY_BYTES - fragment_bytes ))
          plan_note=""
          if [ "$(wc -c < plan.txt)" -gt "${MAX_PLAN_BYTES}" ]; then
            head -c "${MAX_PLAN_BYTES}" plan.txt > plan.comment.txt
            printf '\n... [output truncated — see the full plan in the [job summary](%s) / run log] ...\n' "${RUN_URL}" >> plan.comment.txt
            plan_note="_Plan output truncated for the comment; the full plan is in the [job summary](${RUN_URL})._"
          else
            cp plan.txt plan.comment.txt
          fi

          {
            echo "${MARKER}"
            echo "## Otterdog plan — \`${ORG_GITHUB_ID}\` (read-only)"
            echo
            echo "_\`plan --local --no-web-ui\` against the committed config — the exact tree L0 \`otterdog validate --local\` checks. Nothing is applied._"
            echo
            echo "${status}"
            [ -n "${plan_note}" ] && { echo; echo "${plan_note}"; }
            echo
            echo '<details><summary>Plan output</summary>'
            echo
            echo '```text'
            cat plan.comment.txt
            echo '```'
            echo
            echo '</details>'
            echo
            if [ -s app-actors.comment.md ]; then
              cat app-actors.comment.md
              echo
            fi
            echo "[Run log](${RUN_URL}) · triggered by \`${EVENT_NAME}\`"
          } > comment-body.md

      # Post / update the PR comment in place, keyed by the hidden marker so
      # re-runs edit the same comment instead of stacking. Uses GITHUB_TOKEN
      # (pull-requests: write) — the App token is reserved for the plan itself.
      - name: Upsert plan comment on the PR
        if: always() && github.event_name == 'pull_request' && steps.plan.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          MARKER='<!-- otterdog-plan-report -->'
          jq -Rs '{body: .}' comment-body.md > comment-payload.json
          comment_id="$(gh api "repos/${REPO}/issues/${PR_NUMBER}/comments" --paginate \
            --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" | head -n1)"
          if [ -n "${comment_id}" ]; then
            echo "Updating existing plan comment ${comment_id}"
            gh api --method PATCH "repos/${REPO}/issues/comments/${comment_id}" --input comment-payload.json >/dev/null
          else
            echo "Creating new plan comment"
            gh api --method POST "repos/${REPO}/issues/${PR_NUMBER}/comments" --input comment-payload.json >/dev/null
          fi

      # Reflect otterdog's exit code as the job status AFTER the report is posted,
      # so a validation/auth/harness failure reddens the check while the comment
      # and summary still explain why. Drift (exit 0) never fails here.
      - name: Fail on plan error
        if: always() && steps.plan.outcome != 'skipped'
        env:
          PLAN_RC: ${{ steps.plan.outputs.rc }}
        run: |
          set -euo pipefail
          if [ "${PLAN_RC:-1}" != "0" ]; then
            echo "::error::otterdog plan failed (exit ${PLAN_RC}); this is not drift — check the config, auth, or harness."
            exit 1
          fi
          echo "otterdog plan succeeded (exit 0); any diff shown is drift for the PR author to review."
