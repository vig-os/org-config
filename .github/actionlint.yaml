# actionlint configuration.
#
# The ignores below are TOOL-LAG suppressions, not a baseline (issue
# #169): `job.workflow_sha` — "the commit SHA of the workflow file that
# defines the current job", i.e. inside a reusable workflow the exact SHA the
# caller pins in `uses:` — is documented in the GitHub contexts reference
# (github.com only; not on GHES) and supersedes the buggy
# `github.job_workflow_sha` (actions/runner#2417). actionlint's `job` context
# type (<= 1.7.12) still models only {check_run_id, container, services,
# status} and flags the property as undefined. Scoped to the two workflows that
# check the engine out for a downstream caller, and to this exact message; drop
# both once actionlint learns the property.
paths:
  .github/workflows/drift.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'
  # plan.yml gained the same engine checkout with the App-slug check (#259).
  .github/workflows/plan.yml:
    ignore:
      - 'property "workflow_sha" is not defined in object type'

self-hosted-runner:
  labels:
    # Hosted runners actionlint's built-in list predates. actionlint 1.7.12 is
    # the latest upstream release (2026-03-30) and the ubuntu-26.04 images
    # shipped after it, so no pin bump recognises these. Fold of the devkit
    # 1.16.0 template baseline (vig-os/devkit#1660) into this preserved config.
    # DELETE BOTH once an actionlint release knows them.
    - ubuntu-26.04
    - ubuntu-26.04-arm
