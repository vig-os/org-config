# Drift allow-list (ADR-0002) — downstream org-config starter.
#
# Three sections, all governance state: adding an entry is a normal reviewable
# PR, so "what is intentionally tolerated / unmanaged" stays versioned. Start
# EMPTY and add entries only as real, understood drift appears.
#
# [[expected]] — resources whose SETTINGS divergence is known, benign, and by
#   design, excluded from drift+critical issue creation. `resource` must match an
#   otterdog plan resource header exactly. Example:
#     [[expected]]
#     resource = 'repository[name="some-repo"]'
#     reason = "why this divergence is expected on every run"
#
# [[unmanaged]] — the `managed: false` allow-list (inventory sweep): repos
#   intentionally out of declarative scope. A repo named here is exempt from BOTH
#   undeclared-repo flagging AND settings-reconciliation flagging, in both
#   directions. Its name stays visible and reviewed here. Example:
#     [[unmanaged]]
#     repository = "some-private-repo"
#     reason = "why it is intentionally not under declarative management"
#
# [[app_actor]] — App slugs the plan report's App-slug check must treat as
#   KNOWN-unresolvable rather than as a finding. That check asks
#   `GET /apps/{slug}` with the plan job's installation token, the call `apply`
#   itself makes, so a 403/404 means `apply` cannot write that actor. Where the
#   cause is permanent and by design — typically a PRIVATE App, which answers
#   403 to an installation token even while the ruleset naming it is live and
#   correct — an entry here moves the slug into the report's "known and
#   suppressed" table with its reason, instead of a red finding on every pull
#   request that nobody can act on. The slug is still named on every run.
#   Example:
#     [[app_actor]]
#     slug = "some-private-app"
#     reason = "private App; unreadable to an installation token until otterdog#772"

# No [[expected]], [[unmanaged]] or [[app_actor]] entries yet.
