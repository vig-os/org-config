# Scheduled drift caller (downstream org-config skeleton, ADR-0006).
#
# Read-only posture: drift runs `otterdog plan` + reconciles deduplicated
# `drift`/`critical` issues (ADR-0002). It mutates only THIS repo's issues, never
# org state, so a Free-plan org may run it before the Team upgrade.
#
# SELF-CONTAINED (issue #169): the reusable `drift` workflow reads the committed
# config, `drift-allowlist.toml` and `unmanaged-controls.toml` from THIS repo's
# checkout, and runs the in-house `drift-layer` reconciler from a second checkout
# of the public engine repo at the exact SHA pinned in `uses:` below — no
# vendoring in this repo, and the engine code can never skew from the pinned
# workflow. Nothing to configure beyond the pin.
#
# PIN (ADR-0006, BINDING): replace `@vX.Y.Z` with a released tag of
# vig-os/org-config (SHA for medtech; keep the tag in a trailing comment).
name: Drift

on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "17 3 * * *"   # daily 03:17 UTC — adjust per org
  workflow_dispatch:

jobs:
  drift:
    permissions:
      contents: read
    uses: vig-os/org-config/.github/workflows/drift.yml@vX.Y.Z  # TODO(pin): exact tag or SHA
    with:
      org_github_id: YOUR_ORG      # TODO: this org's GitHub login (e.g. exo-pet)
      config_repo: org-config      # TODO: this repo's name, if different
      # Keep in lockstep with the engine's justfile.project otterdog pin (#56);
      # Renovate can bump this alongside the engine SHA pin above.
      otterdog_version: "1.4.0"
    secrets:
      ORG_CONFIG_APP_CLIENT_ID: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
      ORG_CONFIG_APP_PRIVATE_KEY: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
