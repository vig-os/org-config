# Apply-on-merge caller (downstream org-config skeleton, ADR-0006).
#
# WRITE PATH — enable LAST. Per ADR-0006 sequencing, a Free-plan org onboards
# read-only (plan + drift) first; only AFTER it upgrades to GitHub Team and its
# App install is granted write does apply get wired. Until then, keep this file
# absent or its trigger commented out.
#
# The reusable workflow runs in the `production` environment (a required-reviewer
# human gate on every mutation). Create a `production` environment in this repo's
# Settings with a required reviewer and a `dev`-only deployment-branch policy
# before the first apply.
#
# PIN (ADR-0006, BINDING): replace `@vX.Y.Z` with a released tag of
# vig-os/org-config (SHA for medtech; keep the tag in a trailing comment).
name: Apply

on:  # yamllint disable-line rule:truthy
  push:
    branches:
      - dev
    paths:
      - otterdog.json
      - otterdog/**
      - secrets/**
      - .sops.yaml
  workflow_dispatch:

jobs:
  apply:
    permissions:
      contents: read
    uses: vig-os/org-config/.github/workflows/apply.yml@vX.Y.Z  # TODO(pin): exact tag or SHA
    with:
      org_github_id: YOUR_ORG      # TODO: this org's GitHub login (e.g. exo-pet)
      config_repo: org-config      # TODO: this repo's name, if different
    secrets:
      ORG_CONFIG_APP_CLIENT_ID: ${{ secrets.ORG_CONFIG_APP_CLIENT_ID }}
      ORG_CONFIG_APP_PRIVATE_KEY: ${{ secrets.ORG_CONFIG_APP_PRIVATE_KEY }}
      # Only if this org declares secrets/*.yaml ciphertext (ADR-0003):
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
