# Test allow-list of expected/benign drift (mirrors the real drift-allowlist.toml
# format). Records whose resource matches an entry are marked `expected` and are
# excluded from issue creation (ADR-0002 `managed: false` / known-artifact policy).

[[expected]]
resource = 'repository[name="vs-dolt"]'
reason = "code_scanning_default_languages javascript-typescript split — upstream import artifact, cosmetic and expected on every run"

# `managed: false` allow-list (ADR-0002): repos intentionally out of declarative
# scope. Named here so they stay reviewed, but exempt from undeclared-repo and
# settings-reconciliation flagging.
[[unmanaged]]
repository = "legacy-sandbox"
reason = "throwaway experiment repo, never brought under config"

[[unmanaged]]
repository = "external-mirror"
reason = "read-only mirror managed by an upstream automation, not by us"

# App slugs the plan-time check reports as known-unresolvable rather than as a
# finding (#259): the canonical case is a private App an installation token
# cannot read, on a ruleset that is already live and correct.
[[app_actor]]
slug = "private-sibling-app"
reason = "private App owned by a sibling org"
