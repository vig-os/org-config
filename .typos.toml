# Typos configuration
# https://github.com/crate-ci/typos

[default.extend-words]
# Shell scripting: sed label syntax uses 'ba' (branch to label 'a')
ba = "ba"
# CVE policy term (#637): a finding "unexcepted" = not in the exception register
unexcepted = "unexcepted"
# version-check.sh duration placeholder (#759): 'Nd' = N days (cf. Nw/Nh/Nm)
Nd = "Nd"
# podman rootless-networking helper package name (#1106), not a misspelling
passt = "passt"
# gpg `--with-colons` output field name for a key fingerprint (#22 apply bridge)
fpr = "fpr"
# `mis-parse` in the devkit-generated mirror-fold block of release-core.yml
# (#181). Devkit's own .typos.toml allows it; this seeded file is never
# overwritten on upgrade, so the entry has to be added by hand. Drop it once
# vig-os/devkit#1529 rewords the generated comment.
mis = "mis"

[files]
# SOPS/age ciphertext (#22) is base64 blobs, not prose — spell-checking it only
# yields false positives. detect-private-keys / check-yaml still cover it.
extend-exclude = ["secrets/"]
